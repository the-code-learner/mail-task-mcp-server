services:
  postmaster-mcp:
    image: python:3.12-slim-bookworm
    container_name: postmaster-mcp
    restart: unless-stopped
    working_dir: /opt/postmaster
    ports:
      - "8787:8000"
    volumes:
      - mcp_code:/opt/postmaster
      - mcp_venv:/opt/venv
      - mcp_data:/data
    environment:
      TZ: Europe/Rome
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

      # Bootstrap update policy. `latest` follows stable GitHub Releases; an explicit version/tag/commit stays pinned.
      POSTMASTER_REPO: the-code-learner/mail-task-mcp-server
      POSTMASTER_VERSION: latest
      POSTMASTER_CHECK_UPDATES_ON_START: "true"
      POSTMASTER_FORCE_REFRESH: "false"

      # Primary mail account. Leave secrets only in your private Portainer stack.
      MAIL_EMAIL: ""
      MAIL_PASSWORD: ""
      IMAP_HOST: imap.example.com
      IMAP_PORT: "993"
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "465"
      SMTP_STARTTLS: "false"

      ENABLE_SEND: "false"
      SEND_RECIPIENT_ALLOWLIST: ""
      ALLOW_PREVIOUS_SENT_RECIPIENTS: "true"
      CONTACT_HISTORY_LIMIT: "500"
      SAVE_SENT_COPY: "true"
      SENT_MAILBOX: Sent
      MAX_MESSAGE_BYTES: "5242880"
      SEARCH_CANDIDATE_LIMIT: "500"
      MAX_ATTACHMENT_BYTES: "10485760"
      MAX_ATTACHMENT_MESSAGE_BYTES: "26214400"
      ATTACHMENT_READ_MAX_CHARS: "200000"

      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      PUBLIC_MCP_HOST: ""

      SCHEDULER_DB_PATH: /data/scheduler.db
      SCHEDULER_POLL_SECONDS: "15"
      DEFAULT_OWNER_ID: default
      DEFAULT_OWNER_NAME: Default User
      ALLOW_AUTOMATIC_EMAIL_JOBS: "false"

      DRAFT_MAILBOX: Drafts
      INBOX_MAILBOX: INBOX
      JUNK_MAILBOX: Junk
      RECIPIENT_POLICY_DB_PATH: /data/recipient-policy.db
      FILE_STORE_DB_PATH: /data/files.db
      FILE_STORE_ROOT: /data/files
      FILE_STORE_MAX_BYTES: "1048576"
      FILE_STORE_MAX_TOTAL_BYTES: "104857600"
      FILE_STORE_MAX_FILES: "1000"
      FILE_STORE_TEXT_MAX_CHARS: "200000"
      FILE_STORE_REMOTE_TIMEOUT_SECONDS: "30"
      FILE_STORE_REMOTE_MAX_REDIRECTS: "3"
      FILE_STORE_REMOTE_MAX_BATCH_FILES: "20"
      FILE_STORE_PUBLIC_BASE_URL: ""
      FILE_STORE_DOWNLOAD_SECRET: ""
      FILE_STORE_DOWNLOAD_URL_TTL_SECONDS: "900"
      MAIL_ACCOUNTS_DB_PATH: /data/mail-accounts.db
      MAIL_ACCOUNTS_KEY_PATH: /data/mail-accounts.key
      EMAIL_ANALYTICS_DB_PATH: /data/email-analytics.db
      EMAIL_ANALYTICS_KEY_PATH: /data/email-analytics.key
      PUBLIC_EMAIL_BASE_URL: ""

      CONTEXT_DB_PATH: /data/knowledge.db
      CONTEXT_CHUNK_CHARS: "1200"
      CONTEXT_CHUNK_OVERLAP: "160"
      CONTEXT_SEMANTIC_ENABLED: "true"
      CONTEXT_MODEL_AUTO_PREPARE: "true"
      CONTEXT_MODEL_AUTO_DOWNLOAD: "true"
      CONTEXT_MODEL_URL: https://github.com/the-code-learner/mail-task-mcp-server/releases/download/context-model-v1/postmaster-context-mrl-128d-int8.tar.gz
      CONTEXT_MODEL_SHA256: 33aebe14cc1cc8e506bca5f2d08fe243f94d4a716875f172f96229bb33bff632
      CONTEXT_MODEL_SOURCE_FALLBACK: "true"
      CONTEXT_MODEL_ID: static-similarity-mrl-multilingual-v1-128d-int8
      CONTEXT_MODEL_PATH: /data/models/static-similarity-mrl-multilingual-int8-128d
      CONTEXT_MODEL_SOURCE_ID: sentence-transformers/static-similarity-mrl-multilingual-v1
      CONTEXT_MODEL_SOURCE_REVISION: bb98c751b8b9d3b8b9d43e8836ed0b659cef9a05
      CONTEXT_MODEL_DIMS: "128"
      CONTEXT_AUTO_INDEX_ON_SEARCH: "true"
      CONTEXT_AUTO_INDEX_LIMIT: "10000"
      CONTEXT_SEMANTIC_WEIGHT: "0.60"
      CONTEXT_LEXICAL_WEIGHT: "0.25"
      CONTEXT_PRIORITY_WEIGHT: "0.10"
      CONTEXT_SCOPE_WEIGHT: "0.05"
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        APP_ROOT=/opt/postmaster
        REPO="$${POSTMASTER_REPO:-the-code-learner/mail-task-mcp-server}"
        REQUESTED="$${POSTMASTER_VERSION:-$${POSTMASTER_REF:-latest}}"
        CHECK_UPDATES="$${POSTMASTER_CHECK_UPDATES_ON_START:-true}"
        FORCE_REFRESH="$${POSTMASTER_FORCE_REFRESH:-$${POSTMASTER_REFRESH_ON_START:-false}}"
        CURRENT="$$APP_ROOT/current"
        mkdir -p "$$APP_ROOT/releases"

        case "$$CHECK_UPDATES" in
          true|false) ;;
          *) echo "ERROR: POSTMASTER_CHECK_UPDATES_ON_START must be true or false." >&2; exit 2 ;;
        esac

        case "$$REQUESTED" in
          [0-9]*.[0-9]*.[0-9]*) REQUESTED="v$$REQUESTED" ;;
        esac

        REF=""
        if [ "$$REQUESTED" = "latest" ]; then
          if [ "$$CHECK_UPDATES" = "false" ] && [ -x "$$CURRENT/scripts/start.sh" ] && [ -s "$$CURRENT/.postmaster-source-ready" ]; then
            REF="$$(sed -n '1p' "$$CURRENT/.postmaster-source-ready" | tr -d '\r\n')"
            if [ -n "$$REF" ]; then
              echo "Postmaster update check disabled; using cached current source: $$REF"
            fi
          fi

          if [ -z "$$REF" ]; then
            export REPO
            if REF="$$(python - <<'PY'
        import json
        import os
        import re
        import urllib.request

        repo = os.environ["REPO"]
        if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
            raise RuntimeError("Invalid POSTMASTER_REPO")
        request = urllib.request.Request(
            f"https://api.github.com/repos/{repo}/releases?per_page=100",
            headers={
                "Accept": "application/vnd.github+json",
                "User-Agent": "Postmaster-MCP-bootstrap",
            },
        )
        with urllib.request.urlopen(request, timeout=30) as response:
            payload = json.load(response)
        candidates = []
        for release in payload if isinstance(payload, list) else []:
            if release.get("draft") or release.get("prerelease"):
                continue
            tag = str(release.get("tag_name") or "").strip()
            match = re.fullmatch(r"v([0-9]+)\.([0-9]+)\.([0-9]+)", tag)
            if match:
                candidates.append((tuple(int(x) for x in match.groups()), tag))
        if not candidates:
            raise RuntimeError("No stable Postmaster vX.Y.Z release found")
        print(max(candidates, key=lambda item: item[0])[1])
        PY
            )"; then
              :
            elif [ -x "$$CURRENT/scripts/start.sh" ]; then
              if [ -s "$$CURRENT/.postmaster-source-ready" ]; then
                CACHED_REF="$$(sed -n '1p' "$$CURRENT/.postmaster-source-ready" | tr -d '\r\n')"
                if [ -n "$$CACHED_REF" ]; then
                  export POSTMASTER_REF="$$CACHED_REF"
                fi
              fi
              export POSTMASTER_REQUESTED_VERSION="$$REQUESTED"
              echo "WARNING: could not resolve latest release; using cached current release." >&2
              exec "$$CURRENT/scripts/start.sh"
            else
              echo "ERROR: could not resolve latest release and no cached release exists." >&2
              exit 1
            fi
          fi
        else
          REF="$$REQUESTED"
        fi

        export POSTMASTER_REQUESTED_VERSION="$$REQUESTED"
        export POSTMASTER_REF="$$REF"
        REF_KEY="$$(printf '%s' "$$REF" | tr '/:@ ' '____')"
        TARGET="$$APP_ROOT/releases/$$REF_KEY"

        if [ "$$FORCE_REFRESH" = "true" ] || [ ! -f "$$TARGET/.postmaster-source-ready" ]; then
          STAGING="$$APP_ROOT/releases/.staging-$$REF_KEY-$$$$"
          rm -rf "$$STAGING"
          mkdir -p "$$STAGING"
          export REPO REF STAGING
          if python - <<'PY'
        import io
        import os
        import pathlib
        import shutil
        import stat
        import tarfile
        import urllib.parse
        import urllib.request

        repo = os.environ["REPO"]
        ref = os.environ["REF"]
        staging = pathlib.Path(os.environ["STAGING"])
        url = f"https://codeload.github.com/{repo}/tar.gz/{urllib.parse.quote(ref, safe='')}"
        print(f"Fetching Postmaster source: {repo}@{ref}")
        with urllib.request.urlopen(url, timeout=60) as response:
            payload = response.read()
        with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
            members = archive.getmembers()
            roots = {m.name.split('/', 1)[0] for m in members if m.name}
            if len(roots) != 1:
                raise RuntimeError(f"Unexpected archive roots: {sorted(roots)}")
            root = next(iter(roots))
            for member in members:
                name = member.name
                if name == root:
                    continue
                rel = pathlib.PurePosixPath(name).relative_to(root)
                if rel.is_absolute() or ".." in rel.parts:
                    raise RuntimeError(f"Unsafe archive path: {name}")
                if member.issym() or member.islnk():
                    raise RuntimeError(f"Archive links are not allowed: {name}")
                dest = staging.joinpath(*rel.parts)
                if member.isdir():
                    dest.mkdir(parents=True, exist_ok=True)
                    continue
                if not member.isfile():
                    continue
                dest.parent.mkdir(parents=True, exist_ok=True)
                src = archive.extractfile(member)
                if src is None:
                    raise RuntimeError(f"Could not read archive member: {name}")
                with src, dest.open("wb") as out:
                    shutil.copyfileobj(src, out)
                if member.mode & stat.S_IXUSR:
                    dest.chmod(dest.stat().st_mode | stat.S_IXUSR)
        (staging / ".postmaster-source-ready").write_text(ref + "\n")
        PY
          then
            rm -rf "$$TARGET"
            mv "$$STAGING" "$$TARGET"
          else
            rm -rf "$$STAGING"
            if [ ! -f "$$TARGET/.postmaster-source-ready" ]; then
              if [ -x "$$CURRENT/scripts/start.sh" ]; then
                echo "WARNING: requested release download failed; using cached current release." >&2
                exec "$$CURRENT/scripts/start.sh"
              fi
              echo "ERROR: source download failed and no cached release exists." >&2
              exit 1
            fi
            echo "WARNING: source refresh failed; using cached $$TARGET" >&2
          fi
        fi

        rm -f "$$CURRENT"
        ln -s "$$TARGET" "$$CURRENT"
        exec "$$CURRENT/scripts/start.sh"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/venv/bin/python -c "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  mcp_code:
  mcp_venv:
  mcp_data:
