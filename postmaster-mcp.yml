              return max(1_000, min(int(os.getenv("ATTACHMENT_READ_MAX_CHARS", "60000")), 500_000))

          @staticmethod
          def _qident(name: str) -> str:
              return '"' + str(name).replace('"', '""') + '"'

          @classmethod
          def _policy_columns(cls, conn: sqlite3.Connection, table: str) -> dict[str, sqlite3.Row]:
              qtable = cls._qident(table)
              return {str(r["name"]): r for r in conn.execute(f"PRAGMA table_info({qtable})").fetchall()}

          @staticmethod
          def _pick_column(columns: dict[str, sqlite3.Row], *names: str) -> str | None:
              for name in names:
                  if name in columns:
                      return name
              return None

          def _migrate_policy_schema(self, conn: sqlite3.Connection) -> None:
              """Idempotently migrate old recipient-policy DBs to the v7.2 canonical schema."""
              conn.execute(
                  """
                  CREATE TABLE IF NOT EXISTS policy_meta (
                      key TEXT PRIMARY KEY,
                      value TEXT NOT NULL
                  )
                  """
              )

              current = conn.execute(
                  "SELECT value FROM policy_meta WHERE key='schema_version'"
              ).fetchone()

              # Do not trust only the version marker: verify the two critical key columns too.
              recipient_cols = self._policy_columns(conn, "authorized_recipients")
              domain_cols = self._policy_columns(conn, "authorized_domains")
              schema_already_ok = (
                  current is not None
                  and str(current["value"]) == "7.2"
                  and {"email", "note", "created_at"}.issubset(recipient_cols)
                  and {"domain", "note", "created_at"}.issubset(domain_cols)
                  and int(recipient_cols["email"]["pk"] or 0) > 0
                  and int(domain_cols["domain"]["pk"] or 0) > 0
              )
              if schema_already_ok:
                  return

              conn.execute("BEGIN IMMEDIATE")
              try:
                  tables = {
                      str(r["name"])
                      for r in conn.execute(
                          "SELECT name FROM sqlite_master WHERE type='table'"
                      ).fetchall()
                  }

                  # --- Exact recipients ---
                  conn.execute("DROP TABLE IF EXISTS __v72_authorized_recipients")
                  conn.execute(
                      """
                      CREATE TABLE __v72_authorized_recipients (
                          email TEXT PRIMARY KEY COLLATE NOCASE,
                          note TEXT NOT NULL DEFAULT '',
                          created_at TEXT NOT NULL
                      )
                      """
                  )
                  if "authorized_recipients" in tables:
                      cols = self._policy_columns(conn, "authorized_recipients")
                      email_col = self._pick_column(
                          cols, "email", "email_address", "address", "recipient"
                      )
                      if email_col is None:
                          raise sqlite3.OperationalError(
                              "authorized_recipients has no recognizable email column: "
                              + ", ".join(cols)
                          )
                      note_col = self._pick_column(cols, "note", "notes", "description")
                      created_col = self._pick_column(
                          cols, "created_at", "created", "added_at", "timestamp"
                      )
                      qe = self._qident(email_col)
                      note_expr = (
                          f"COALESCE(CAST({self._qident(note_col)} AS TEXT), '')"
                          if note_col else "''"
                      )
                      created_expr = (
                          f"COALESCE(CAST({self._qident(created_col)} AS TEXT), CURRENT_TIMESTAMP)"
                          if created_col else "CURRENT_TIMESTAMP"
                      )
                      conn.execute(
                          f"""
                          INSERT OR IGNORE INTO __v72_authorized_recipients(email, note, created_at)
                          SELECT LOWER(TRIM(CAST({qe} AS TEXT))), {note_expr}, {created_expr}
                          FROM authorized_recipients
                          WHERE {qe} IS NOT NULL AND TRIM(CAST({qe} AS TEXT)) <> ''
                          """
                      )
                      conn.execute("DROP TABLE authorized_recipients")
                  conn.execute(
                      "ALTER TABLE __v72_authorized_recipients RENAME TO authorized_recipients"
                  )

                  # --- Authorized domains ---
                  conn.execute("DROP TABLE IF EXISTS __v72_authorized_domains")
                  conn.execute(
                      """
                      CREATE TABLE __v72_authorized_domains (
                          domain TEXT PRIMARY KEY COLLATE NOCASE,
                          note TEXT NOT NULL DEFAULT '',
                          created_at TEXT NOT NULL
                      )
                      """
                  )
                  if "authorized_domains" in tables:
                      cols = self._policy_columns(conn, "authorized_domains")
                      domain_col = self._pick_column(cols, "domain", "domain_name", "hostname")
                      if domain_col is None:
                          raise sqlite3.OperationalError(
                              "authorized_domains has no recognizable domain column: "
                              + ", ".join(cols)
                          )
                      note_col = self._pick_column(cols, "note", "notes", "description")
                      created_col = self._pick_column(
                          cols, "created_at", "created", "added_at", "timestamp"
                      )
                      qd = self._qident(domain_col)
                      note_expr = (
                          f"COALESCE(CAST({self._qident(note_col)} AS TEXT), '')"
                          if note_col else "''"
                      )
                      created_expr = (
                          f"COALESCE(CAST({self._qident(created_col)} AS TEXT), CURRENT_TIMESTAMP)"
                          if created_col else "CURRENT_TIMESTAMP"
                      )
                      conn.execute(
                          f"""
                          INSERT OR IGNORE INTO __v72_authorized_domains(domain, note, created_at)
                          SELECT LOWER(RTRIM(TRIM(CAST({qd} AS TEXT)), '.')), {note_expr}, {created_expr}
                          FROM authorized_domains
                          WHERE {qd} IS NOT NULL AND TRIM(CAST({qd} AS TEXT)) <> ''
                          """
                      )
                      conn.execute("DROP TABLE authorized_domains")
                  conn.execute(
                      "ALTER TABLE __v72_authorized_domains RENAME TO authorized_domains"
                  )

                  # Verify the actual UPSERT syntax used by authorize_recipient/domain.
                  conn.execute("SAVEPOINT v72_probe")
                  try:
                      probe_time = datetime.now(timezone.utc).isoformat()
                      conn.execute(
                          """
                          INSERT INTO authorized_recipients(email, note, created_at)
                          VALUES ('__v72_probe__@invalid.invalid', 'probe', ?)
                          ON CONFLICT(email) DO UPDATE SET note=excluded.note
                          """,
                          (probe_time,),
                      )
                      conn.execute(
                          """
                          INSERT INTO authorized_recipients(email, note, created_at)
                          VALUES ('__V72_PROBE__@INVALID.INVALID', 'probe2', ?)
                          ON CONFLICT(email) DO UPDATE SET note=excluded.note
                          """,
                          (probe_time,),
                      )
                  finally:
                      conn.execute("ROLLBACK TO v72_probe")
                      conn.execute("RELEASE v72_probe")

                  conn.execute(
                      "INSERT OR REPLACE INTO policy_meta(key, value) VALUES ('schema_version', '7.2')"
                  )
                  integrity = conn.execute("PRAGMA integrity_check").fetchone()[0]
                  if str(integrity).lower() != "ok":
                      raise sqlite3.DatabaseError(f"policy DB integrity_check failed: {integrity}")
                  conn.commit()
                  print("[mail-policy] v7.2 idempotent migration complete", flush=True)
              except Exception:
                  conn.rollback()
                  raise

          def _policy_connect(self) -> sqlite3.Connection:
              path = Path(self.policy_db_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              conn = sqlite3.connect(path, timeout=15)
              conn.row_factory = sqlite3.Row
              conn.execute("PRAGMA journal_mode=WAL")
              conn.execute("PRAGMA busy_timeout=15000")

              if not getattr(self, "_policy_schema_v72_ready", False):
                  with _POLICY_MIGRATION_LOCK:
                      if not getattr(self, "_policy_schema_v72_ready", False):
                          self._migrate_policy_schema(conn)
                          self._policy_schema_v72_ready = True

              # These CREATEs remain as a defensive no-op for brand-new/healthy DBs.
              conn.executescript(
                  """
                  CREATE TABLE IF NOT EXISTS authorized_recipients (
                      email TEXT PRIMARY KEY COLLATE NOCASE,
                      note TEXT NOT NULL DEFAULT '',
                      created_at TEXT NOT NULL
                  );

                  CREATE TABLE IF NOT EXISTS authorized_domains (
                      domain TEXT PRIMARY KEY COLLATE NOCASE,
                      note TEXT NOT NULL DEFAULT '',
                      created_at TEXT NOT NULL
                  );

                  CREATE TABLE IF NOT EXISTS policy_meta (
                      key TEXT PRIMARY KEY,
                      value TEXT NOT NULL
                  );
                  """
              )

              seeded = conn.execute(
                  "SELECT value FROM policy_meta WHERE key='env_domains_seeded'"
              ).fetchone()
              if not seeded:
                  now = datetime.now(timezone.utc).isoformat()
                  for domain in self.settings.send_recipient_allowlist:
                      domain = str(domain).strip().lower().lstrip("@")
                      if domain:
                          conn.execute(
                              """
                              INSERT OR IGNORE INTO authorized_domains(domain, note, created_at)
                              VALUES (?, 'Seeded from SEND_RECIPIENT_ALLOWLIST', ?)
                              """,
                              (domain, now),
                          )
                  conn.execute(
                      "INSERT OR REPLACE INTO policy_meta(key, value) VALUES ('env_domains_seeded', '1')"
                  )
                  conn.commit()
              return conn

          def _normalize_domain(self, domain: str) -> str:
              value = (domain or "").strip().lower().lstrip("@").rstrip(".")
              if not value or "." not in value or " " in value or "/" in value:
                  raise MailBridgeError(f"Invalid domain: {domain}")
              if not re.fullmatch(r"[a-z0-9.-]+", value):
                  raise MailBridgeError(f"Invalid domain: {domain}")
              return value

          def _authorized_domains(self) -> set[str]:
              with self._policy_connect() as conn:
                  rows = conn.execute(
                      "SELECT domain FROM authorized_domains ORDER BY domain"
                  ).fetchall()
              return {str(r["domain"]).strip().lower() for r in rows}

          def list_authorized_domains(self) -> dict:
              with self._policy_connect() as conn:
                  rows = conn.execute(
                      """
                      SELECT domain, note, created_at
                      FROM authorized_domains
                      ORDER BY domain
                      """
                  ).fetchall()
              return {
                  "ok": True,
                  "domains": [dict(r) for r in rows],
                  "count": len(rows),
                  "mode": "managed_persistent",
              }

          def authorize_domain(self, domain: str, note: str = "") -> dict:
              value = self._normalize_domain(domain)
              with self._policy_connect() as conn:
                  conn.execute(
                      """
                      INSERT INTO authorized_domains(domain, note, created_at)
                      VALUES (?, ?, ?)
                      ON CONFLICT(domain) DO UPDATE SET note=excluded.note
                      """,
                      (value, note.strip(), datetime.now(timezone.utc).isoformat()),
                  )
              return {
                  "ok": True,
                  "authorized_domain": value,
                  "scope": "domain_and_subdomains",
                  "note": note.strip(),
              }

          def revoke_domain(self, domain: str) -> dict:
              value = self._normalize_domain(domain)
              with self._policy_connect() as conn:
                  cur = conn.execute(
                      "DELETE FROM authorized_domains WHERE domain=?",
                      (value,),
                  )
              return {
                  "ok": True,
                  "revoked_domain": value,
                  "removed": cur.rowcount > 0,
              }

          def _explicit_authorized_addresses(self) -> set[str]:
              with self._policy_connect() as conn:
                  rows = conn.execute("SELECT email FROM authorized_recipients").fetchall()
              return {str(r["email"]).strip().lower() for r in rows}

          def authorize_recipient(self, email_address: str, note: str = "") -> dict:
              _, addr = parseaddr(email_address)
              if not addr or "@" not in addr:
                  raise MailBridgeError(f"Invalid recipient address: {email_address}")
              addr = addr.strip().lower()
              with self._policy_connect() as conn:
                  conn.execute(
                      """
                      INSERT INTO authorized_recipients(email, note, created_at)
                      VALUES (?, ?, ?)
                      ON CONFLICT(email) DO UPDATE SET note=excluded.note
                      """,
                      (addr, note.strip(), datetime.now(timezone.utc).isoformat()),
                  )
              return {"ok": True, "authorized": addr, "scope": "exact_address", "note": note.strip()}

          def revoke_recipient(self, email_address: str) -> dict:
              _, addr = parseaddr(email_address)
              if not addr or "@" not in addr:
                  raise MailBridgeError(f"Invalid recipient address: {email_address}")
              addr = addr.strip().lower()
              with self._policy_connect() as conn:
                  cur = conn.execute("DELETE FROM authorized_recipients WHERE email=?", (addr,))
              return {"ok": True, "revoked": addr, "removed": cur.rowcount > 0}

          def list_authorized_recipients(self) -> dict:
              with self._policy_connect() as conn:
                  rows = conn.execute(
                      "SELECT email, note, created_at FROM authorized_recipients ORDER BY email"
                  ).fetchall()
              return {"ok": True, "recipients": [dict(r) for r in rows], "count": len(rows)}

          def recipient_authorization_status(self, recipients: Iterable[str]) -> dict:
              explicit = self._explicit_authorized_addresses()
              authorized_domains = self._authorized_domains()
              historical = None
              out = []
              for value in recipients:
                  _, addr = parseaddr(value)
                  if not addr or "@" not in addr:
                      raise MailBridgeError(f"Invalid recipient address: {value}")
                  addr = addr.strip()
                  lc = addr.lower()
                  domain = lc.rsplit("@", 1)[1]
                  by_domain = any(
                      domain == allowed or domain.endswith("." + allowed)
                      for allowed in authorized_domains
                  )
                  by_exact = lc in explicit
                  by_history = False
                  if self.settings.allow_previous_sent_recipients:
                      if historical is None:
                          historical = self._historical_sent_addresses()
                      by_history = lc in historical
                  out.append(
                      {
                          "address": addr,
                          "authorized_for_automated_send": by_domain or by_exact or by_history,
                          "by_static_domain": by_domain,
                          "by_exact_authorization": by_exact,
                          "by_previous_sent": by_history,
                      }
                  )
              return {"ok": True, "results": out}

          def _validate_recipients(self, recipients: Iterable[str]) -> list[str]:
              cleaned: list[str] = []
              historical = None
              explicit = self._explicit_authorized_addresses()
              authorized_domains = self._authorized_domains()
              for value in recipients:
                  _, addr = parseaddr(value)
                  if not addr or "@" not in addr:
                      raise MailBridgeError(f"Invalid recipient address: {value}")
                  addr = addr.strip()
                  lc = addr.lower()
                  domain = lc.rsplit("@", 1)[1]
                  by_domain = any(
                      domain == allowed or domain.endswith("." + allowed)
                      for allowed in authorized_domains
                  )
                  by_exact = lc in explicit
                  by_history = False
                  if not by_domain and not by_exact and self.settings.allow_previous_sent_recipients:
                      if historical is None:
                          historical = self._historical_sent_addresses()
                      by_history = lc in historical
                  if (
                      authorized_domains
                      or self.settings.allow_previous_sent_recipients
                      or explicit
                  ) and not (by_domain or by_exact or by_history):
                      raise MailBridgeError(
                          f"Recipient {addr} is not authorized for automated sending. "
                          "Authorize the exact address, add its domain, use a previous recipient, "
                          "or create a draft for manual review/send."
                      )
                  cleaned.append(addr)
              if not cleaned:
                  raise MailBridgeError("At least one recipient is required")
              return list(dict.fromkeys(cleaned))

          def _clean_unlisted_recipients(self, recipients: Iterable[str]) -> list[str]:
              cleaned = []
              for value in recipients:
                  _, addr = parseaddr(value)
                  if not addr or "@" not in addr:
                      raise MailBridgeError(f"Invalid recipient address: {value}")
                  cleaned.append(addr.strip())
              return list(dict.fromkeys(cleaned))

          def _fetch_message_for_attachments(self, mailbox: str, uid: str) -> Message:
              with self._imap() as conn:
                  self._select(conn, mailbox, readonly=True)
                  typ, size_data = conn.uid("FETCH", uid, "(RFC822.SIZE)")
                  if typ != "OK" or not size_data:
                      raise MailBridgeError(f"Could not fetch size for UID {uid}")
                  size = None
                  for item in size_data:
                      if isinstance(item, bytes):
                          match = re.search(rb"RFC822\.SIZE\s+(\d+)", item)
                          if match:
                              size = int(match.group(1))
                              break
                  if size is not None and size > self.max_attachment_message_bytes:
                      raise MailBridgeError(
                          f"Message is too large to fetch for attachments ({size} bytes; "
                          f"limit {self.max_attachment_message_bytes})"
                      )
                  typ, raw_data = conn.uid("FETCH", uid, "(BODY.PEEK[])")
                  if typ != "OK" or not raw_data:
                      raise MailBridgeError(f"Could not fetch UID {uid}")
                  raw = None
                  for item in raw_data:
                      if isinstance(item, tuple) and isinstance(item[1], bytes):
                          raw = item[1]
                          break
                  if raw is None:
                      raise MailBridgeError(f"Could not parse UID {uid}")
              return BytesParser(policy=policy.default).parsebytes(raw)

          def _attachment_parts(self, msg: Message) -> list[tuple[int, Message]]:
              out = []
              idx = 0
              for part in msg.walk():
                  filename = part.get_filename()
                  disposition = part.get_content_disposition()
                  if filename or disposition == "attachment":
                      out.append((idx, part))
                      idx += 1
              return out

          def list_email_attachments(self, mailbox: str, uid: str) -> dict:
              msg = self._fetch_message_for_attachments(mailbox, uid)
              items = []
              for idx, part in self._attachment_parts(msg):
                  payload = part.get_payload(decode=True) or b""
                  items.append(
                      {
                          "index": idx,
                          "filename": part.get_filename() or f"attachment-{idx}",
                          "content_type": part.get_content_type(),
                          "disposition": part.get_content_disposition() or "",
                          "size": len(payload),
                      }
                  )
              return {
                  "ok": True,
                  "mailbox": mailbox,
                  "uid": uid,
                  "message_id": msg.get("Message-ID", ""),
                  "subject": str(msg.get("Subject", "")),
                  "attachments": items,
                  "count": len(items),
              }

          def _find_attachment(
              self,
              mailbox: str,
              uid: str,
              *,
              filename: str | None = None,
              index: int | None = None,
          ) -> tuple[Message, int, Message, bytes]:
              msg = self._fetch_message_for_attachments(mailbox, uid)
              parts = self._attachment_parts(msg)
              target = None
              if index is not None:
                  for idx, part in parts:
                      if idx == index:
                          target = (idx, part)
                          break
              elif filename:
                  wanted = filename.strip().casefold()
                  for idx, part in parts:
                      if (part.get_filename() or "").casefold() == wanted:
                          target = (idx, part)
                          break
              else:
                  if len(parts) == 1:
                      target = parts[0]
                  else:
                      raise MailBridgeError("Specify filename or index when the message has multiple attachments")
              if target is None:
                  raise MailBridgeError("Attachment not found")
              idx, part = target
              blob = part.get_payload(decode=True) or b""
              if len(blob) > self.max_attachment_bytes:
                  raise MailBridgeError(
                      f"Attachment is too large ({len(blob)} bytes; limit {self.max_attachment_bytes})"
                  )
              return msg, idx, part, blob

          def get_email_attachment(
              self,
              mailbox: str,
              uid: str,
              filename: str | None = None,
              index: int | None = None,
              include_base64: bool = True,
          ) -> dict:
              msg, idx, part, blob = self._find_attachment(
                  mailbox, uid, filename=filename, index=index
              )
              result = {
                  "ok": True,
                  "mailbox": mailbox,
                  "uid": uid,
                  "index": idx,
                  "filename": part.get_filename() or f"attachment-{idx}",
                  "content_type": part.get_content_type(),
                  "size": len(blob),
                  "sha256": hashlib.sha256(blob).hexdigest(),
                  "message_id": msg.get("Message-ID", ""),
              }
              if include_base64:
                  result["content_base64"] = base64.b64encode(blob).decode("ascii")
              return result

          def read_email_attachment(
              self,
              mailbox: str,
              uid: str,
              filename: str | None = None,
              index: int | None = None,
              max_chars: int | None = None,
          ) -> dict:
              _, idx, part, blob = self._find_attachment(
                  mailbox, uid, filename=filename, index=index
              )
              ctype = part.get_content_type().lower()
              fname = part.get_filename() or f"attachment-{idx}"
              limit = self.attachment_read_max_chars if max_chars is None else max(
                  1000, min(int(max_chars), 500000)
              )
              text = ""
              extractor = None

              if ctype.startswith("text/") or ctype in {
                  "application/json", "application/xml", "application/javascript",
                  "text/csv",
              }:
                  charset = part.get_content_charset() or "utf-8"
                  text = blob.decode(charset, errors="replace")
                  if ctype == "text/html":
                      text = _strip_html_local(text)
                  extractor = "text"
              elif ctype == "application/pdf" or fname.lower().endswith(".pdf"):
                  try:
                      from pypdf import PdfReader
                      reader = PdfReader(io.BytesIO(blob))
                      text = "\n\n".join((p.extract_text() or "") for p in reader.pages)
                      extractor = "pypdf"
                  except Exception as exc:
                      raise MailBridgeError(f"PDF text extraction failed: {type(exc).__name__}") from exc
              elif (
                  ctype == "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                  or fname.lower().endswith(".docx")
              ):
                  try:
                      with zipfile.ZipFile(io.BytesIO(blob)) as zf:
                          xml = zf.read("word/document.xml")
                      root = ET.fromstring(xml)
                      chunks = []
                      for elem in root.iter():
                          if elem.tag.endswith("}t") and elem.text:
                              chunks.append(elem.text)
                          elif elem.tag.endswith("}p"):
                              chunks.append("\n")
                      text = "".join(chunks)
                      extractor = "docx_xml"
                  except Exception as exc:
                      raise MailBridgeError(f"DOCX text extraction failed: {type(exc).__name__}") from exc
              else:
                  return {
                      "ok": True,
                      "mailbox": mailbox,
                      "uid": uid,
                      "index": idx,
                      "filename": fname,
                      "content_type": ctype,
                      "size": len(blob),
                      "extractable": False,
                      "message": "Binary attachment is downloadable with get_email_attachment but has no text extractor in this build.",
                  }

              truncated = len(text) > limit
              return {
                  "ok": True,
                  "mailbox": mailbox,
                  "uid": uid,
                  "index": idx,
                  "filename": fname,
                  "content_type": ctype,
                  "size": len(blob),
                  "extractable": True,
                  "extractor": extractor,
                  "text": text[:limit],
                  "text_truncated": truncated,
                  "max_chars": limit,
              }

          def _decode_attachment_specs(self, attachments: list[dict[str, Any]] | None) -> list[dict[str, Any]]:
              if not attachments:
                  return []
              out = []
              total = 0
              for spec in attachments:
                  if not isinstance(spec, dict):
                      raise MailBridgeError("Each attachment must be an object")

                  if spec.get("content_base64"):
                      filename = Path(str(spec.get("filename") or "attachment.bin")).name
                      raw_b64 = str(spec["content_base64"]).strip()
                      if raw_b64.startswith("data:") and ";base64," in raw_b64:
                          raw_b64 = raw_b64.split(";base64,", 1)[1]
                      try:
                          blob = base64.b64decode(raw_b64, validate=True)
                      except Exception as exc:
                          raise MailBridgeError(f"Invalid base64 for attachment {filename}") from exc
                      ctype = str(spec.get("content_type") or mimetypes.guess_type(filename)[0] or "application/octet-stream")
                  elif spec.get("source_mailbox") and spec.get("source_uid"):
                      source = self.get_email_attachment(
                          str(spec["source_mailbox"]),
                          str(spec["source_uid"]),
                          filename=spec.get("filename"),
                          index=spec.get("index"),
                          include_base64=False,
                      )
                      _, _, part, blob = self._find_attachment(
                          str(spec["source_mailbox"]),
                          str(spec["source_uid"]),
                          filename=spec.get("filename"),
                          index=spec.get("index"),
                      )
                      filename = Path(source["filename"]).name
                      ctype = str(spec.get("content_type") or source["content_type"])
                  else:
                      raise MailBridgeError(
                          "Attachment requires content_base64 OR source_mailbox + source_uid "
                          "(with filename/index when needed)"
                      )

                  total += len(blob)
                  if total > self.max_attachment_bytes:
                      raise MailBridgeError(
                          f"Total attachment size exceeds limit {self.max_attachment_bytes} bytes"
                      )
                  if "/" not in ctype:
                      ctype = "application/octet-stream"
                  maintype, subtype = ctype.split("/", 1)
                  out.append(
                      {
                          "filename": filename,
                          "blob": blob,
                          "content_type": ctype,
                          "maintype": maintype,
                          "subtype": subtype,
                          "size": len(blob),
                      }
                  )
              return out

          def _build_message(
              self,
              *,
              to: list[str],
              subject: str,
              body: str = "",
              cc: list[str] | None = None,
              bcc: list[str] | None = None,
              body_html: str | None = None,
              body_amp: str | None = None,
              attachments: list[dict[str, Any]] | None = None,
              allow_unlisted: bool = False,
              include_bcc_header: bool = False,
              in_reply_to: str = "",
              references: str = "",
          ) -> tuple[EmailMessage, list[str], list[dict[str, Any]]]:
              cleaner = self._clean_unlisted_recipients if allow_unlisted else self._validate_recipients
              to_clean = cleaner(to)
              cc_clean = cleaner(cc or []) if cc else []
              bcc_clean = cleaner(bcc or []) if bcc else []
              if not body and not body_html:
                  raise MailBridgeError("body or body_html is required as a fallback")
              if body_amp and not bool(getattr(self.settings, "amp_enabled", False)):
                  raise MailBridgeError(
                      f"AMP is disabled for sender account {getattr(self.settings, 'account_id', '') or self.settings.email_address}"
                  )
              if body_amp:
                  check = validate_amp_document(body_amp)
                  if not check.get("ok"):
                      raise MailBridgeError("Invalid AMP email preflight: " + "; ".join(check.get("issues", [])))

              msg = EmailMessage()
              msg["From"] = self.settings.email_address
              msg["To"] = ", ".join(to_clean)
              if cc_clean:
                  msg["Cc"] = ", ".join(cc_clean)
              if include_bcc_header and bcc_clean:
                  msg["Bcc"] = ", ".join(bcc_clean)
              msg["Subject"] = subject.strip()
              if in_reply_to:
                  msg["In-Reply-To"] = in_reply_to
              if references:
                  msg["References"] = references

              plain = body if body else _strip_html_local(body_html or "")
              html = body_html if body_html is not None else _plain_to_html(plain)
              msg.set_content(plain)
              # AMP for Email must appear before the HTML fallback inside multipart/alternative.
              if body_amp:
                  msg.add_alternative(body_amp, subtype="x-amp-html")
              msg.add_alternative(html, subtype="html")

              decoded = self._decode_attachment_specs(attachments)
              for item in decoded:
                  msg.add_attachment(
                      item["blob"],
                      maintype=item["maintype"],
                      subtype=item["subtype"],
                      filename=item["filename"],
                  )

              recipients = list(dict.fromkeys(to_clean + cc_clean + bcc_clean))
              meta = [
                  {
                      "filename": x["filename"],
                      "content_type": x["content_type"],
                      "size": x["size"],
                  }
                  for x in decoded
              ]
              return msg, recipients, meta

          def send_email(
              self,
              *,
              to: list[str],
              subject: str,
              body: str = "",
              cc: list[str] | None = None,
              bcc: list[str] | None = None,
              body_html: str | None = None,
              body_amp: str | None = None,
              attachments: list[dict[str, Any]] | None = None,
              track_opens: bool | None = None,
              campaign_id: str | None = None,
          ) -> dict:
              """
              Send email. Normal sends remain a single message.

              If open tracking is enabled, or an AMP body is supplied, the send is individualized
              per recipient. This is required to keep tracking/AMP tokens separate for every
              destination. Each recipient therefore receives an individualized SMTP copy while the original visible To/Cc headers are preserved.
              """
              amp_used = bool(body_amp)
              if amp_used and not bool(getattr(self.settings, "amp_enabled", False)):
                  raise MailBridgeError(
                      f"AMP is not enabled for account {getattr(self.settings, 'account_id', '') or self.settings.email_address}"
                  )
              if amp_used:
                  check = validate_amp_document(body_amp or "")
                  if not check.get("ok"):
                      raise MailBridgeError("Invalid AMP email preflight: " + "; ".join(check.get("issues", [])))

              if track_opens is None:
                  track_opens = bool(getattr(self.settings, "tracking_default", False))
              else:
                  track_opens = bool(track_opens)

              # Keep v8.1 behavior for ordinary email.
              if not track_opens and not amp_used:
                  msg, recipients, meta = self._build_message(
                      to=to, subject=subject, body=body, cc=cc, bcc=bcc,
                      body_html=body_html, attachments=attachments, allow_unlisted=False
                  )
                  result = self._send_message(msg, recipients)
                  result.update({
                      "html": True,
                      "amp": False,
                      "tracked": False,
                      "attachments": meta,
                  })
                  return result

              # Validate once and preserve the original role of each recipient.
              to_clean = self._validate_recipients(to)
              cc_clean = self._validate_recipients(cc or []) if cc else []
              bcc_clean = self._validate_recipients(bcc or []) if bcc else []
              recipient_roles: list[tuple[str, str]] = []
              seen: set[str] = set()
              for role, addresses in (("to", to_clean), ("cc", cc_clean), ("bcc", bcc_clean)):
                  for address in addresses:
                      key = address.lower()
                      if key not in seen:
                          seen.add(key)
                          recipient_roles.append((address, role))

              analytics = analytics_store()
              campaign = analytics.create_campaign(
                  account_id=getattr(self.settings, "account_id", "") or self.settings.email_address,
                  sender=self.settings.email_address,
                  subject=subject.strip(),
                  track_opens=track_opens,
                  amp_used=amp_used,
                  campaign_id=campaign_id,
              )

              base_html = body_html if body_html is not None else _plain_to_html(body)
              delivery_results: list[dict[str, Any]] = []
              errors: list[dict[str, Any]] = []
              attachment_meta: list[dict[str, Any]] = []

              for recipient, role in recipient_roles:
                  delivery = analytics.create_delivery(
                      campaign_id=campaign["id"],
                      account_id=getattr(self.settings, "account_id", "") or self.settings.email_address,
                      recipient=recipient,
                      recipient_role=role,
                  )
                  rendered_html, rendered_amp = analytics.render_for_recipient(
                      body_html=base_html,
                      body_amp=body_amp,
                      delivery=delivery,
                      track_opens=track_opens,
                  )
                  try:
                      # v8.3: individual SMTP envelope, original visible recipient headers.
                      # Every recipient gets a unique rendered body/token, but To:/Cc: remain
                      # exactly as composed so group context and Reply-All semantics are preserved.
                      # Bcc is intentionally omitted from visible headers.
                      msg, _, meta = self._build_message(
                          to=to_clean,
                          cc=cc_clean,
                          subject=subject,
                          body=body,
                          body_html=rendered_html,
                          body_amp=rendered_amp,
                          attachments=attachments,
                          allow_unlisted=False,
                      )
                      # Critical privacy/tracking boundary: only the current recipient is used
                      # as the SMTP envelope destination even though visible To/Cc are complete.
                      result = self._send_message(msg, [recipient])
                      analytics.mark_sent(delivery["id"], str(result.get("message_id", "")))
                      attachment_meta = meta
                      delivery_results.append({
                          "delivery_id": delivery["id"],
                          "recipient": recipient,
                          "role": role,
                          "message_id": result.get("message_id", ""),
                          "sent_copy_saved": result.get("sent_copy_saved", False),
                      })
                  except Exception as exc:
                      errors.append({
                          "delivery_id": delivery["id"],
                          "recipient": recipient,
                          "role": role,
                          "error": f"{type(exc).__name__}: {exc}",
                      })

              return {
                  "sent": bool(delivery_results) and not errors,
                  "partial": bool(delivery_results) and bool(errors),
                  "from": self.settings.email_address,
                  "subject": subject.strip(),
                  "campaign_id": campaign["id"],
                  "individualized": True,
                  "visible_recipient_headers_preserved": True,
                  "tracked": track_opens,
                  "amp": amp_used,
                  "amp_registered": bool(getattr(self.settings, "amp_registered", False)),
                  "deliveries": delivery_results,
                  "errors": errors,
                  "attachments": attachment_meta,
                  "tracking_note": (
                      "Open events are image loads and may be affected by mail proxies, scanners, "
                      "image blocking or prefetching."
                  ) if track_opens else "",
              }

          def reply_email(
              self,
              *,
              mailbox: str,
              uid: str,
              body: str = "",
              cc: list[str] | None = None,
              bcc: list[str] | None = None,
              body_html: str | None = None,
              attachments: list[dict[str, Any]] | None = None,
          ) -> dict:
              original = self.get_email(mailbox, uid)
              from_addresses = original.get("from_addresses") or []
              if not from_addresses:
                  raise MailBridgeError("Original email has no valid From address")
              subject = original.get("subject", "") or ""
              if not subject.lower().startswith("re:"):
                  subject = f"Re: {subject}"
              message_id = original.get("message_id", "") or ""
              refs = original.get("references", "").strip()
              references = (refs + " " + message_id).strip() if message_id else refs
              msg, recipients, meta = self._build_message(
                  to=[from_addresses[0]], subject=subject, body=body, cc=cc, bcc=bcc,
                  body_html=body_html, attachments=attachments, allow_unlisted=False,
                  in_reply_to=message_id, references=references,
              )
              result = self._send_message(msg, recipients)
              result.update({"html": True, "attachments": meta})
              return result

          def _save_draft(self, msg: EmailMessage) -> dict:
              if "Date" not in msg:
                  from email.utils import format_datetime
                  msg["Date"] = format_datetime(datetime.now().astimezone())
              if "Message-ID" not in msg:
                  from email.utils import make_msgid
                  domain = self.settings.email_address.rsplit("@", 1)[-1]
                  msg["Message-ID"] = make_msgid(domain=domain)

              with self._imap() as conn:
                  typ, _ = conn.append(
                      self.draft_mailbox,
                      r"(\Seen \Draft)",
                      imaplib.Time2Internaldate(datetime.now().timestamp()),
                      msg.as_bytes(policy=policy.SMTP),
                  )
                  if typ != "OK":
                      raise MailBridgeError("Could not save draft via IMAP APPEND")
              return {
                  "draft_saved": True,
                  "mailbox": self.draft_mailbox,
                  "from": self.settings.email_address,
                  "to": [a for _, a in getaddresses([msg.get("To", "")]) if a],
                  "cc": [a for _, a in getaddresses([msg.get("Cc", "")]) if a],
                  "bcc": [a for _, a in getaddresses([msg.get("Bcc", "")]) if a],
                  "subject": str(msg.get("Subject", "")),
                  "message_id": str(msg.get("Message-ID", "")),
              }

          def create_draft(
              self,
              *,
              to: list[str],
              subject: str,
              body: str = "",
              cc: list[str] | None = None,
              bcc: list[str] | None = None,
              body_html: str | None = None,
              body_amp: str | None = None,
              attachments: list[dict[str, Any]] | None = None,
          ) -> dict:
              msg, recipients, meta = self._build_message(
                  to=to, subject=subject, body=body, cc=cc, bcc=bcc,
                  body_html=body_html, body_amp=body_amp, attachments=attachments,
                  allow_unlisted=True, include_bcc_header=True,
              )
              result = self._save_draft(msg)
              result.update(
                  {
                      "html": True,
                      "attachments": meta,
                      "recipient_authorization": self.recipient_authorization_status(recipients)["results"],
                  }
              )
              return result

          def create_reply_draft(
              self,
              *,
              mailbox: str,
              uid: str,
              body: str = "",
              cc: list[str] | None = None,
              bcc: list[str] | None = None,
              body_html: str | None = None,
              attachments: list[dict[str, Any]] | None = None,
          ) -> dict:
              original = self.get_email(mailbox, uid)
              from_addresses = original.get("from_addresses") or []
              if not from_addresses:
                  raise MailBridgeError("Original email has no valid From address")
              subject = original.get("subject", "") or ""
              if not subject.lower().startswith("re:"):
                  subject = f"Re: {subject}"
              message_id = original.get("message_id", "") or ""
              refs = original.get("references", "").strip()
              references = (refs + " " + message_id).strip() if message_id else refs
              msg, recipients, meta = self._build_message(
                  to=[from_addresses[0]], subject=subject, body=body, cc=cc, bcc=bcc,
                  body_html=body_html, attachments=attachments,
                  allow_unlisted=True, include_bcc_header=True,
                  in_reply_to=message_id, references=references,
              )
              result = self._save_draft(msg)
              result.update(
                  {
                      "html": True,
                      "attachments": meta,
                      "recipient_authorization": self.recipient_authorization_status(recipients)["results"],
                      "reply_to": {"mailbox": mailbox, "uid": uid, "message_id": message_id},
                  }
              )
              return result

          def move_email(self, mailbox: str, uid: str, destination_mailbox: str) -> dict:
              with self._imap() as conn:
                  self._select(conn, mailbox, readonly=False)
                  caps = {
                      (x.decode() if isinstance(x, bytes) else str(x)).upper()
                      for x in getattr(conn, "capabilities", ())
                  }
                  if "MOVE" in caps:
                      typ, _ = conn.uid("MOVE", uid, destination_mailbox)
                      if typ != "OK":
                          raise MailBridgeError("IMAP MOVE failed")
                      method = "MOVE"
                  else:
                      typ, _ = conn.uid("COPY", uid, destination_mailbox)
                      if typ != "OK":
                          raise MailBridgeError("IMAP COPY failed")
                      typ, _ = conn.uid("STORE", uid, "+FLAGS.SILENT", r"(\Deleted)")
                      if typ != "OK":
                          raise MailBridgeError("Copied message but could not mark source deleted")
                      conn.expunge()
                      method = "COPY+DELETE"
              return {
                  "ok": True,
                  "moved": True,
                  "source_mailbox": mailbox,
                  "destination_mailbox": destination_mailbox,
                  "uid": uid,
                  "method": method,
              }

          def set_seen(self, mailbox: str, uid: str, seen: bool) -> dict:
              with self._imap() as conn:
                  self._select(conn, mailbox, readonly=False)
                  op = "+FLAGS.SILENT" if seen else "-FLAGS.SILENT"
                  typ, _ = conn.uid("STORE", uid, op, r"(\Seen)")
                  if typ != "OK":
                      raise MailBridgeError("Could not update \\Seen flag")
              return {"ok": True, "mailbox": mailbox, "uid": uid, "seen": seen}

          def mark_not_spam(self, mailbox: str, uid: str) -> dict:
              # Moving out of Junk is the most portable IMAP operation. Best-effort removal
              # of common junk keywords is attempted first, but not required for success.
              with self._imap() as conn:
                  self._select(conn, mailbox, readonly=False)
                  for flags in (r"(\Junk)", r"($Junk)", r"(Junk)", r"(Spam)"):
                      try:
                          conn.uid("STORE", uid, "-FLAGS.SILENT", flags)
                      except Exception:
                          pass
              result = self.move_email(mailbox, uid, self.inbox_mailbox)
              result["marked_not_spam"] = True
              return result

          def mark_as_spam(self, mailbox: str, uid: str) -> dict:
              # Best-effort add common junk keywords, then move to the configured Junk mailbox.
              with self._imap() as conn:
                  self._select(conn, mailbox, readonly=False)
                  for flags in (r"($Junk)", r"(Junk)", r"(Spam)"):
                      try:
                          conn.uid("STORE", uid, "+FLAGS.SILENT", flags)
                          break
                      except Exception:
                          continue
              result = self.move_email(mailbox, uid, self.junk_mailbox)
              result["marked_as_spam"] = True
              return result
  account_store_py:
    content: |
      from __future__ import annotations

      import os
      import re
      import sqlite3
      import threading
      from dataclasses import asdict
      from datetime import datetime, timezone
      from pathlib import Path
      from typing import Any

      from cryptography.fernet import Fernet, InvalidToken
      from mail_bridge import Settings, MailBridgeError


      class AccountStoreError(RuntimeError):
          pass


      _ID_RE = re.compile(r"^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}$")
      _LOCK = threading.RLock()


      def _now() -> str:
          return datetime.now(timezone.utc).isoformat()


      def _env_bool(name: str, default: bool) -> bool:
          raw = os.getenv(name)
          if raw is None:
              return default
          return raw.strip().lower() in {"1", "true", "yes", "on"}


      def _slug(value: str) -> str:
          value = re.sub(r"[^a-zA-Z0-9_.-]+", "-", value.strip().lower()).strip("-.")
          return (value or "mail")[:64]


      class MailAccountStore:
          """Persistent encrypted multi-account IMAP/SMTP configuration."""

          def __init__(
              self,
              db_path: str | None = None,
              key_path: str | None = None,
          ):
              self.db_path = db_path or os.getenv("MAIL_ACCOUNTS_DB_PATH", "/data/mail_accounts.db")
              self.key_path = key_path or os.getenv("MAIL_ACCOUNTS_KEY_PATH", "/data/mail_accounts.key")
              Path(self.db_path).parent.mkdir(parents=True, exist_ok=True)
              Path(self.key_path).parent.mkdir(parents=True, exist_ok=True)
              self._fernet = Fernet(self._load_or_create_key())
              self._init_db()
              self._migrate_legacy_env()

          def _load_or_create_key(self) -> bytes:
              path = Path(self.key_path)
              if path.exists():
                  key = path.read_bytes().strip()
                  try:
                      Fernet(key)
                      return key
                  except Exception as exc:
                      raise AccountStoreError(f"Invalid account encryption key at {path}") from exc
              key = Fernet.generate_key()
              tmp = path.with_suffix(path.suffix + ".tmp")
              tmp.write_bytes(key + b"\n")
              try:
                  os.chmod(tmp, 0o600)
              except Exception:
                  pass
              tmp.replace(path)
              try:
                  os.chmod(path, 0o600)
              except Exception:
                  pass
              return key

          def _connect(self) -> sqlite3.Connection:
              conn = sqlite3.connect(self.db_path, timeout=20)
              conn.row_factory = sqlite3.Row
              conn.execute("PRAGMA journal_mode=WAL")
              conn.execute("PRAGMA busy_timeout=20000")
              return conn

          def _init_db(self) -> None:
              with self._connect() as conn:
                  conn.execute(
                      """
                      CREATE TABLE IF NOT EXISTS mail_accounts (
                          id TEXT PRIMARY KEY COLLATE NOCASE,
                          label TEXT NOT NULL DEFAULT '',
                          email_address TEXT NOT NULL,
                          imap_host TEXT NOT NULL,
                          imap_port INTEGER NOT NULL DEFAULT 993,
                          imap_security TEXT NOT NULL DEFAULT 'ssl',
                          imap_username TEXT NOT NULL DEFAULT '',
                          imap_password_enc TEXT NOT NULL,
                          smtp_host TEXT NOT NULL,
                          smtp_port INTEGER NOT NULL DEFAULT 465,
                          smtp_security TEXT NOT NULL DEFAULT 'ssl',
                          smtp_username TEXT NOT NULL DEFAULT '',
                          smtp_password_enc TEXT NOT NULL,
                          sent_mailbox TEXT NOT NULL DEFAULT 'Sent',
                          draft_mailbox TEXT NOT NULL DEFAULT 'Drafts',
                          inbox_mailbox TEXT NOT NULL DEFAULT 'INBOX',
                          junk_mailbox TEXT NOT NULL DEFAULT 'Junk',
                          enabled INTEGER NOT NULL DEFAULT 1,
                          is_default INTEGER NOT NULL DEFAULT 0,
                          amp_enabled INTEGER NOT NULL DEFAULT 0,
                          amp_tested INTEGER NOT NULL DEFAULT 0,
                          amp_registered INTEGER NOT NULL DEFAULT 0,
                          amp_review_sent_at TEXT NOT NULL DEFAULT '',
                          amp_notes TEXT NOT NULL DEFAULT '',
                          tracking_default INTEGER NOT NULL DEFAULT 0,
                          created_at TEXT NOT NULL,
                          updated_at TEXT NOT NULL
                      )
                      """
                  )

                  # v8.2 idempotent migration for existing v8/v8.1 account databases.
                  existing = {
                      str(row["name"])
                      for row in conn.execute("PRAGMA table_info(mail_accounts)").fetchall()
                  }
                  migrations = {
                      "amp_enabled": "INTEGER NOT NULL DEFAULT 0",
                      "amp_tested": "INTEGER NOT NULL DEFAULT 0",
                      "amp_registered": "INTEGER NOT NULL DEFAULT 0",
                      "amp_review_sent_at": "TEXT NOT NULL DEFAULT ''",
                      "amp_notes": "TEXT NOT NULL DEFAULT ''",
                      "tracking_default": "INTEGER NOT NULL DEFAULT 0",
                  }
                  for column, sql_type in migrations.items():
                      if column not in existing:
                          conn.execute(f'ALTER TABLE mail_accounts ADD COLUMN "{column}" {sql_type}')

                  conn.execute(
                      "CREATE UNIQUE INDEX IF NOT EXISTS ux_mail_accounts_default "
                      "ON mail_accounts(is_default) WHERE is_default=1"
                  )
                  conn.execute(
                      """
                      CREATE TABLE IF NOT EXISTS mail_accounts_meta (
                          key TEXT PRIMARY KEY,
                          value TEXT NOT NULL
                      )
                      """
                  )
                  conn.execute(
                      "INSERT OR REPLACE INTO mail_accounts_meta(key,value) VALUES('schema_version','8.2')"
                  )

          def _enc(self, value: str) -> str:
              return self._fernet.encrypt((value or "").encode("utf-8")).decode("ascii")

          def _dec(self, value: str) -> str:
              try:
                  return self._fernet.decrypt(value.encode("ascii")).decode("utf-8")
              except InvalidToken as exc:
                  raise AccountStoreError(
                      "Could not decrypt stored mail credentials. The persistent encryption key "
                      "does not match the database."
                  ) from exc

          def _migrate_legacy_env(self) -> None:
              """One-time import of the v7 single-account environment when credentials are present."""
              with self._connect() as conn:
                  count = conn.execute("SELECT COUNT(*) FROM mail_accounts").fetchone()[0]
                  marker = conn.execute(
                      "SELECT value FROM mail_accounts_meta WHERE key='legacy_env_import'"
                  ).fetchone()
                  if count or marker:
                      return

              email = os.getenv("LEGACY_EMAIL_ADDRESS", "").strip()
              password = os.getenv("LEGACY_EMAIL_PASSWORD", "")
              if email and password:
                  account_id = _slug(email.replace("@", "-"))
                  self.save_account(
                      account_id=account_id,
                      label="Primary / migrated from v7",
                      email_address=email,
                      imap_host=os.getenv("IMAP_HOST", "imap.example.com").strip(),
                      imap_port=int(os.getenv("IMAP_PORT", "993")),
                      imap_security="ssl",
                      imap_username=email,
                      imap_password=password,
                      smtp_host=os.getenv("SMTP_HOST", "smtp.example.com").strip(),
                      smtp_port=int(os.getenv("SMTP_PORT", "465")),
                      smtp_security="starttls" if _env_bool("SMTP_STARTTLS", False) else "ssl",
                      smtp_username=email,
                      smtp_password=password,
                      sent_mailbox=os.getenv("SENT_MAILBOX", "INBOX.Sent").strip() or "INBOX.Sent",
                      draft_mailbox=os.getenv("DRAFT_MAILBOX", "INBOX.Drafts").strip() or "INBOX.Drafts",
                      inbox_mailbox=os.getenv("INBOX_MAILBOX", "INBOX").strip() or "INBOX",
                      junk_mailbox=os.getenv("JUNK_MAILBOX", "INBOX.Junk").strip() or "INBOX.Junk",
                      enabled=True,
                      make_default=True,
                  )
              with self._connect() as conn:
                  conn.execute(
                      "INSERT OR REPLACE INTO mail_accounts_meta(key,value) VALUES('legacy_env_import',?)",
                      (_now(),),
                  )

          def _validate_security(self, value: str, kind: str) -> str:
              value = (value or "").strip().lower()
              allowed = {"ssl", "starttls", "plain"}
              if value not in allowed:
                  raise AccountStoreError(f"{kind}_security must be one of {sorted(allowed)}")
              return value

          def list_accounts(self, *, include_disabled: bool = True) -> list[dict[str, Any]]:
              q = "SELECT * FROM mail_accounts"
              if not include_disabled:
                  q += " WHERE enabled=1"
              q += " ORDER BY is_default DESC, label COLLATE NOCASE, email_address COLLATE NOCASE"
              with self._connect() as conn:
                  rows = conn.execute(q).fetchall()
              return [self._public_row(r) for r in rows]

          def _public_row(self, row: sqlite3.Row | dict[str, Any]) -> dict[str, Any]:
              d = dict(row)
              d.pop("imap_password_enc", None)
              d.pop("smtp_password_enc", None)
              d["enabled"] = bool(d.get("enabled"))
              d["is_default"] = bool(d.get("is_default"))
              d["amp_enabled"] = bool(d.get("amp_enabled"))
              d["amp_tested"] = bool(d.get("amp_tested"))
              d["amp_registered"] = bool(d.get("amp_registered"))
              d["tracking_default"] = bool(d.get("tracking_default"))
              d["capabilities"] = {
                  "html_email": True,
                  "attachments": True,
                  "open_tracking": True,
                  "amp_email": bool(d.get("amp_enabled")),
              }
              d["imap_password_saved"] = True
              d["smtp_password_saved"] = True
              return d

          def resolve_id(self, account_id: str | None = None) -> str:
              with self._connect() as conn:
                  if account_id:
                      row = conn.execute(
                          "SELECT id FROM mail_accounts WHERE id=? AND enabled=1",
                          (account_id.strip(),),
                      ).fetchone()
                  else:
                      row = conn.execute(
                          "SELECT id FROM mail_accounts WHERE enabled=1 "
                          "ORDER BY is_default DESC, created_at ASC LIMIT 1"
                      ).fetchone()
              if not row:
                  if account_id:
                      raise AccountStoreError(f"Unknown or disabled email account: {account_id}")
                  raise AccountStoreError(
                      "No enabled email accounts are configured. Add one from the WebGUI Accounts tab."
                  )
              return str(row["id"])

          def get_account(self, account_id: str | None = None, *, include_secrets: bool = False) -> dict[str, Any]:
              resolved = self.resolve_id(account_id)
              with self._connect() as conn:
                  row = conn.execute("SELECT * FROM mail_accounts WHERE id=?", (resolved,)).fetchone()
              if not row:
                  raise AccountStoreError(f"Unknown email account: {resolved}")
              if not include_secrets:
                  return self._public_row(row)
              d = dict(row)
              d["imap_password"] = self._dec(d.pop("imap_password_enc"))
              d["smtp_password"] = self._dec(d.pop("smtp_password_enc"))
              d["enabled"] = bool(d["enabled"])
              d["is_default"] = bool(d["is_default"])
              d["amp_enabled"] = bool(d.get("amp_enabled"))
              d["amp_tested"] = bool(d.get("amp_tested"))
              d["amp_registered"] = bool(d.get("amp_registered"))
              d["tracking_default"] = bool(d.get("tracking_default"))
              return d

          def save_account(
              self,
              *,
              account_id: str,
              label: str,
              email_address: str,
              imap_host: str,
              imap_port: int,
              imap_security: str,
              imap_username: str,
              imap_password: str,
              smtp_host: str,
              smtp_port: int,
              smtp_security: str,
              smtp_username: str,
              smtp_password: str,
              sent_mailbox: str,
              draft_mailbox: str,
              inbox_mailbox: str,
              junk_mailbox: str,
              enabled: bool = True,
              make_default: bool = False,
              tracking_default: bool | None = None,
          ) -> dict[str, Any]:
              account_id = (account_id or "").strip() or _slug(email_address.replace("@", "-"))
              if not _ID_RE.fullmatch(account_id):
                  raise AccountStoreError(
                      "account_id must use letters, numbers, dot, underscore or dash (max 64 chars)"
                  )
              email_address = email_address.strip()
              if "@" not in email_address:
                  raise AccountStoreError("A valid email address is required")
              imap_host = imap_host.strip()
              smtp_host = smtp_host.strip()
              if not imap_host or not smtp_host:
                  raise AccountStoreError("IMAP and SMTP hosts are required")
              imap_port = int(imap_port)
              smtp_port = int(smtp_port)
              if not 1 <= imap_port <= 65535 or not 1 <= smtp_port <= 65535:
                  raise AccountStoreError("IMAP/SMTP ports must be between 1 and 65535")
              imap_security = self._validate_security(imap_security, "imap")
              smtp_security = self._validate_security(smtp_security, "smtp")
              imap_username = (imap_username or email_address).strip()
              smtp_username = (smtp_username or email_address).strip()

              with _LOCK, self._connect() as conn:
                  old = conn.execute("SELECT * FROM mail_accounts WHERE id=?", (account_id,)).fetchone()
                  if old:
                      imap_enc = (
                          self._enc(imap_password)
                          if imap_password
                          else str(old["imap_password_enc"])
                      )
                      smtp_enc = (
                          self._enc(smtp_password)
                          if smtp_password
                          else str(old["smtp_password_enc"])
                      )
                      created = str(old["created_at"])
                  else:
                      if not imap_password:
                          raise AccountStoreError("IMAP password is required for a new account")
                      if not smtp_password:
                          smtp_password = imap_password
                      imap_enc = self._enc(imap_password)
                      smtp_enc = self._enc(smtp_password)
                      created = _now()

                  if make_default:
                      conn.execute("UPDATE mail_accounts SET is_default=0")
                  elif not old:
                      existing = conn.execute(
                          "SELECT COUNT(*) FROM mail_accounts WHERE enabled=1"
                      ).fetchone()[0]
                      make_default = existing == 0

                  now = _now()
                  conn.execute(
                      """
                      INSERT INTO mail_accounts(
                          id,label,email_address,
                          imap_host,imap_port,imap_security,imap_username,imap_password_enc,
                          smtp_host,smtp_port,smtp_security,smtp_username,smtp_password_enc,
                          sent_mailbox,draft_mailbox,inbox_mailbox,junk_mailbox,
                          enabled,is_default,tracking_default,created_at,updated_at
                      ) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)
                      ON CONFLICT(id) DO UPDATE SET
                          label=excluded.label,
                          email_address=excluded.email_address,
                          imap_host=excluded.imap_host,
                          imap_port=excluded.imap_port,
                          imap_security=excluded.imap_security,
                          imap_username=excluded.imap_username,
                          imap_password_enc=excluded.imap_password_enc,
                          smtp_host=excluded.smtp_host,
                          smtp_port=excluded.smtp_port,
                          smtp_security=excluded.smtp_security,
                          smtp_username=excluded.smtp_username,
                          smtp_password_enc=excluded.smtp_password_enc,
                          sent_mailbox=excluded.sent_mailbox,
                          draft_mailbox=excluded.draft_mailbox,
                          inbox_mailbox=excluded.inbox_mailbox,
                          junk_mailbox=excluded.junk_mailbox,
                          enabled=excluded.enabled,
                          is_default=CASE WHEN excluded.is_default=1 THEN 1 ELSE mail_accounts.is_default END,
                          tracking_default=excluded.tracking_default,
                          updated_at=excluded.updated_at
                      """,
                      (
                          account_id, label.strip(), email_address,
                          imap_host, imap_port, imap_security, imap_username, imap_enc,
                          smtp_host, smtp_port, smtp_security, smtp_username, smtp_enc,
                          sent_mailbox.strip() or "Sent",
                          draft_mailbox.strip() or "Drafts",
                          inbox_mailbox.strip() or "INBOX",
                          junk_mailbox.strip() or "Junk",
                          1 if enabled else 0,
                          1 if make_default else (int(old["is_default"]) if old else 0),
                          (
                              1 if tracking_default else 0
                              if tracking_default is not None
                              else (int(old["tracking_default"]) if old else 0)
                          ),
                          created, now,
                      ),
                  )
                  if make_default:
                      conn.execute(
                          "UPDATE mail_accounts SET is_default=CASE WHEN id=? THEN 1 ELSE 0 END",
                          (account_id,),
                      )
              return self.get_account(account_id)

          def set_amp_state(
              self,
              account_id: str,
              *,
              enabled: bool | None = None,
              tested: bool | None = None,
              registered: bool | None = None,
              review_sent: bool = False,
              notes: str | None = None,
          ) -> dict[str, Any]:
              resolved = self.resolve_id(account_id)
              updates = []
              params: list[Any] = []
              for column, value in (
                  ("amp_enabled", enabled),
                  ("amp_tested", tested),
                  ("amp_registered", registered),
              ):
                  if value is not None:
                      updates.append(f"{column}=?")
                      params.append(1 if value else 0)
              if review_sent:
                  updates.append("amp_review_sent_at=?")
                  params.append(_now())
              if notes is not None:
                  updates.append("amp_notes=?")
                  params.append(notes.strip()[:4000])
              if not updates:
                  return self.get_account(resolved)
              updates.append("updated_at=?")
              params.append(_now())
              params.append(resolved)
              with _LOCK, self._connect() as conn:
                  conn.execute(
                      f"UPDATE mail_accounts SET {', '.join(updates)} WHERE id=?",
                      params,
                  )
              return self.get_account(resolved)

          def amp_status(self, account_id: str | None = None) -> dict[str, Any]:
              row = self.get_account(account_id)
              return {
                  "ok": True,
                  "account_id": row["id"],
                  "email_address": row["email_address"],
                  "amp_enabled": bool(row.get("amp_enabled")),
                  "amp_tested": bool(row.get("amp_tested")),
                  "amp_registered": bool(row.get("amp_registered")),
                  "amp_review_sent_at": row.get("amp_review_sent_at", ""),
                  "amp_notes": row.get("amp_notes", ""),
                  "mcp_capability_visible": bool(row.get("amp_enabled")),
                  "procedure": [
                      "Enable AMP for this sender account.",
                      "In the destination Gmail test account: Settings > General > Dynamic email > Developer settings; allow this sender.",
                      "Send a production-system AMP test with text/plain and text/html fallbacks.",
                      "Verify SPF and aligned DKIM pass; DMARC is recommended; delivery must use TLS.",
                      "Validate the delivered AMP MIME part and dynamic endpoints.",
                      "Send one real production-ready AMP email from this exact sender to ampforemail.whitelisting@gmail.com.",
                      "Submit Google's sender registration form. Registration is per sender email address.",
                  ],
              }

          def set_default(self, account_id: str) -> dict[str, Any]:
              resolved = self.resolve_id(account_id)
              with _LOCK, self._connect() as conn:
                  conn.execute("UPDATE mail_accounts SET is_default=0")
                  conn.execute(
                      "UPDATE mail_accounts SET is_default=1, updated_at=? WHERE id=?",
                      (_now(), resolved),
                  )
              return self.get_account(resolved)

          def delete_account(self, account_id: str) -> dict[str, Any]:
              account_id = (account_id or "").strip()
              with _LOCK, self._connect() as conn:
                  row = conn.execute("SELECT * FROM mail_accounts WHERE id=?", (account_id,)).fetchone()
                  if not row:
                      raise AccountStoreError(f"Unknown email account: {account_id}")
                  was_default = bool(row["is_default"])
                  conn.execute("DELETE FROM mail_accounts WHERE id=?", (account_id,))
                  if was_default:
                      replacement = conn.execute(
                          "SELECT id FROM mail_accounts WHERE enabled=1 ORDER BY created_at ASC LIMIT 1"
                      ).fetchone()
                      if replacement:
                          conn.execute(
                              "UPDATE mail_accounts SET is_default=1 WHERE id=?",
                              (replacement["id"],),
                          )
              return {"ok": True, "deleted": account_id}

          def settings(self, account_id: str | None = None) -> Settings:
              row = self.get_account(account_id, include_secrets=True)
              allowlist = tuple(
                  x.strip().lower()
                  for x in os.getenv("SEND_RECIPIENT_ALLOWLIST", "").split(",")
                  if x.strip()
              )
              return Settings(
                  email_address=row["email_address"],
                  email_password=row["imap_password"],
                  imap_host=row["imap_host"],
                  imap_port=int(row["imap_port"]),
                  smtp_host=row["smtp_host"],
                  smtp_port=int(row["smtp_port"]),
                  smtp_starttls=row["smtp_security"] == "starttls",
                  enable_send=_env_bool("ENABLE_SEND", False),
                  max_message_bytes=int(os.getenv("MAX_MESSAGE_BYTES", "2000000")),
                  search_candidate_limit=int(os.getenv("SEARCH_CANDIDATE_LIMIT", "500")),
                  sent_mailbox=row["sent_mailbox"],
                  save_sent_copy=_env_bool("SAVE_SENT_COPY", True),
                  send_recipient_allowlist=allowlist,
                  allow_previous_sent_recipients=_env_bool("ALLOW_PREVIOUS_SENT_RECIPIENTS", True),
                  contact_history_limit=max(1, min(int(os.getenv("CONTACT_HISTORY_LIMIT", "5000")), 20000)),
                  account_id=row["id"],
                  imap_security=row["imap_security"],
                  imap_username=row["imap_username"],
                  imap_password=row["imap_password"],
                  smtp_security=row["smtp_security"],
                  smtp_username=row["smtp_username"],
                  smtp_password=row["smtp_password"],
                  draft_mailbox=row["draft_mailbox"],
                  inbox_mailbox=row["inbox_mailbox"],
                  junk_mailbox=row["junk_mailbox"],
                  amp_enabled=bool(row.get("amp_enabled")),
                  amp_registered=bool(row.get("amp_registered")),
                  tracking_default=bool(row.get("tracking_default")),
              )
