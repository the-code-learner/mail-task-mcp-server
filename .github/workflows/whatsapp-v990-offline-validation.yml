name: WhatsApp v9.9 offline validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/postmaster/whatsapp_v990/**'
      - 'src/postmaster/whatsapp_runtime_v990.py'
      - 'src/postmaster/webgui_whatsapp_v990.py'
      - 'tests/test_whatsapp_*_v990.py'
      - 'scripts/whatsapp_v990_network_smoke.py'
      - 'scripts/whatsapp_v990_noise_server_hello_probe.py'
      - 'scripts/whatsapp_v990_noise_registration_probe.py'
      - 'scripts/whatsapp_v990_pair_device_probe.py'
      - 'scripts/whatsapp_v990_controlled_interop.py'
      - '.github/workflows/whatsapp-v990-offline-validation.yml'
      - '.github/workflows/whatsapp-v990-controlled-interop.yml'
      - '.github/workflows/stable-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsapp-v990-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-protocol:
    name: WhatsApp v9.9 offline protocol/runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile WhatsApp candidate
        run: |
          python -m compileall -q \
            src/postmaster/whatsapp_v990 \
            src/postmaster/whatsapp_runtime_v990.py \
            src/postmaster/webgui_whatsapp_v990.py \
            scripts/whatsapp_v990_controlled_interop.py \
            tests

      - name: Run WhatsApp offline regression suite
        env:
          PYTHONPATH: src
        run: |
          python -W error::ResourceWarning -m unittest discover             -s tests             -p 'test_whatsapp_*_v990.py'             -v

      - name: Guard controlled-account release boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('src/postmaster/whatsapp_runtime_v990.py').read_text(encoding='utf-8')
          harness = Path('scripts/whatsapp_v990_controlled_interop.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/whatsapp-v990-controlled-interop.yml').read_text(encoding='utf-8')
          stable_release = Path('.github/workflows/stable-release.yml').read_text(encoding='utf-8')

          expected_false = (
              '"protocol_interop_verified": False',
              '"signal_multidevice_verified": False',
              '"controlled_account_interop_verified": False',
          )
          missing = [item for item in expected_false if item not in runtime]
          assert not missing, (
              'Live acceptance flags must stay false until controlled-account evidence exists: '
              f'{missing}'
          )

          required_harness_checks = (
              'POSTMASTER_WA_TEST_GROUP_JID',
              'group_sender_key_interop_observed',
              'media_interop_observed',
              'receipt_policy_observed',
              'inbound_group_media_stored_file_observed',
              'controlled_account_interop_observed',
          )
          missing = [item for item in required_harness_checks if item not in harness]
          assert not missing, f'Controlled interop harness lost release-critical checks: {missing}'

          required_workflow_checks = (
              'environment: whatsapp-v990-controlled',
              'POSTMASTER_WA_TEST_GROUP_JID',
              'require_group_echo',
              'require_inbound_media',
              'controlled_account_interop_observed=true',
          )
          missing = [item for item in required_workflow_checks if item not in workflow]
          assert not missing, f'Controlled interop workflow lost release-critical gates: {missing}'

          release_interlock = (
              "version == '9.9.0'",
              '"protocol_interop_verified": True',
              '"signal_multidevice_verified": True',
              '"controlled_account_interop_verified": True',
              'Refusing stable v9.9.0 release',
          )
          missing = [item for item in release_interlock if item not in stable_release]
          assert not missing, f'Stable-release WhatsApp interlock is incomplete: {missing}'

          print(
              'Offline validation passed; implementation can advance without an account, '
              'but stable acceptance remains controlled-account gated.'
          )
          PY

  network-transport-smoke:
    name: WhatsApp WebSocket unauthenticated transport smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe current WhatsApp WebSocket endpoint
        run: python scripts/whatsapp_v990_network_smoke.py

      - name: State acceptance boundary
        if: always()
        run: |
          echo "This job validates only DNS/TCP/TLS/RFC6455 reachability."
          echo "It does not validate QR pairing, Noise authentication, Signal multi-device, account interoperability, messages, media, groups, or receipts."

  live-noise-server-hello:
    name: WhatsApp live Noise ServerHello probe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository crypto runtime and CI-only WebSocket driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'websockets>=15,<16'

      - name: Decrypt live Noise ServerHello and verify certificate chain
        env:
          PYTHONPATH: src
        run: python scripts/whatsapp_v990_noise_server_hello_probe.py

      - name: State acceptance boundary
        if: always()
        run: |
          echo "This job stops before ClientFinish/ClientPayload."
          echo "No QR/account/device credentials or authenticated WhatsApp actions are exercised."
          echo "Passing does not set protocol_interop_verified, signal_multidevice_verified, or controlled_account_interop_verified."

  live-registration-pair-device:
    name: WhatsApp live ClientFinish and pair-device probe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Complete throw-away registration and receive encrypted pair-device
        env:
          PYTHONPATH: src
        run: python scripts/whatsapp_v990_pair_device_probe.py

      - name: State acceptance boundary
        if: always()
        run: |
          echo "This job validates ClientFinish, current ClientPayload, encrypted transport and WABinary pair-device refs."
          echo "QR refs are never printed or persisted and no account is paired."
          echo "Passing still does not set signal_multidevice_verified or controlled_account_interop_verified."


  live-noise-client-finish:
    name: WhatsApp live Noise ClientFinish registration probe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository crypto runtime and CI-only WebSocket driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'websockets>=15,<16'

      - name: Send live ClientFinish and authenticate first transport response
        env:
          PYTHONPATH: src
        run: python scripts/whatsapp_v990_noise_registration_probe.py

      - name: State acceptance boundary
        if: always()
        run: |
          echo "This job uses fresh one-run Noise/Signal registration material and stops before QR scan/account pairing."
          echo "Passing validates ClientFinish/registration transport compatibility only."
          echo "It does not set protocol_interop_verified, signal_multidevice_verified, or controlled_account_interop_verified."
