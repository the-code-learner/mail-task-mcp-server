name: Apply v9.1 file store once

on:
  push:
    branches:
      - v9.1-file-store
    paths:
      - 'scripts/apply_v9_1_file_store.py'
      - '.github/workflows/apply-v9-1-file-store-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.1-file-store
      - name: Apply v9.1 integration edits
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_v9_1_file_store.py')
          s = p.read_text()
          old = 'return ContextEngine()\\n\\ndef _safe_call'
          new = 'return ContextEngine()\\n\\n\\ndef _safe_call'
          if old not in s:
              raise SystemExit('expected context refactor anchor not found')
          s = s.replace(old, new, 1)
          old2 = '"· task registry · v9.0</p>", "· task registry + small files · v9.1</p>"'
          new2 = '"task registry · v9.0</p>", "task registry + small files · v9.1</p>"'
          if old2 not in s:
              raise SystemExit('expected dashboard subtitle refactor anchor not found')
          s = s.replace(old2, new2, 1)
          old3 = 'if count != 1:\n        raise RuntimeError(f"{label}: expected one match, found {count}")'
          new3 = 'if count != 1 and not (label == "overview file count" and count >= 1):\n        raise RuntimeError(f"{label}: expected one match, found {count}")'
          if old3 not in s:
              raise SystemExit('expected replace_once helper not found')
          p.write_text(s.replace(old3, new3, 1))
          PY
          python scripts/apply_v9_1_file_store.py
          rm scripts/apply_v9_1_file_store.py
      - name: Commit transformed tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate v9.1 small-file store'
          git push origin HEAD:v9.1-file-store
