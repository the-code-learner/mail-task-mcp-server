name: v9.4.2 README patch

on:
  push:
    branches:
      - v9.4.2-follow-up-recipients
    paths:
      - .github/workflows/v9-4-2-readme-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.4.2-follow-up-recipients
      - name: Patch README in place
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '+-- drafts, replies and attachments': '+-- drafts, replies, follow-ups and attachments',
              'Postmaster MCP supports plain text, HTML, attachments, drafts, replies and forwarded messages.': 'Postmaster MCP supports plain text, HTML, attachments, drafts, replies, follow-ups and forwarded messages.',
              'Open tracking can be configured per account and overridden for individual sends/replies.': 'Open tracking can be configured per account and overridden for individual sends/replies/follow-ups.',
              'Tracked multi-recipient delivery uses a distinct token per recipient while preserving visible `To` / `Cc` headers. `Bcc` remains hidden. Replies preserve normal threading headers.': 'Tracked multi-recipient delivery uses a distinct token per recipient while preserving visible `To` / `Cc` headers. `Bcc` remains hidden. Replies and follow-ups preserve normal threading headers.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing README anchor: {old!r}')
              text = text.replace(old, new, 1)

          marker = '\n---\n\n# Recipient safety\n'
          section = '''\n---\n\n# Reply vs follow-up (v9.4.2)\n\nThreaded mail actions deliberately separate inbound replies from outbound follow-ups:\n\n```text\nreply_email             -> reply to an inbound message\ncreate_reply_draft      -> draft a reply to an inbound message\nfollow_up_email         -> follow up an outbound/Sent message\ncreate_follow_up_draft  -> draft a follow-up to an outbound/Sent message\n```\n\nFor inbound messages, `reply_email` prefers a valid `Reply-To` and otherwise uses `From`. Calling it on a message clearly sent by the selected account is rejected with guidance to use `follow_up_email`, preventing self-replies.\n\nFor outbound/Sent messages, `follow_up_email` reuses the original visible `To` and preserves the original visible `Cc` by default. The sender account and its configured email identities are removed case-insensitively, duplicates are removed while preserving order, and at least one external `To` recipient must remain. Original Bcc recipients are never rediscovered, inferred or exposed. Calling follow-up on an inbound message is rejected.\n\nBoth modes preserve normal threading: one normalized `Re:` prefix, `In-Reply-To` pointing to the selected message's `Message-ID`, and `References` preserved/extended. Follow-up sending uses the same recipient-authorization, tracking, individualized-delivery and clean-Sent pipeline as existing sends/replies; it does not introduce a parallel tracking implementation.\n\n---\n\n# Recipient safety\n'''
          if marker not in text:
              raise SystemExit('Missing Recipient safety insertion anchor')
          text = text.replace(marker, section, 1)

          release_section = '''\n\n# Explicit reply/follow-up semantics (v9.4.2)\n\nv9.4.2 prevents outbound messages from accidentally being replied back to the sender account. `reply_email` / `create_reply_draft` are inbound-only semantics, while `follow_up_email` / `create_follow_up_draft` operate on outbound/Sent messages and reuse the original visible recipients after sender-identity filtering. Source Bcc is never recovered.\n\nTracked follow-ups reuse the v9.4 dual-MIME pipeline: recipient copies may contain the configured open/link instrumentation, while archived Sent copies keep original URLs and omit active recipient pixel, click-tracking URLs and recipient AMP callbacks. Visible `To` / `Cc`, threading headers and attachment bytes remain consistent. No new environment variables, ports, volumes, callback paths or Portainer YAML changes are required.\n'''
          if '# Explicit reply/follow-up semantics (v9.4.2)' not in text:
              text = text.rstrip() + release_section + '\n'

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- README.md
      - name: Commit README update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m 'Document v9.4.2 reply and follow-up semantics'
          git push origin HEAD:v9.4.2-follow-up-recipients
