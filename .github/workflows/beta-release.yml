name: beta application release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version matching VERSION in the selected branch (e.g. 9.8.6-beta.1)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: beta-application-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify explicit beta version and release notes
        env:
          REQUESTED_BETA: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          requested=os.environ["REQUESTED_BETA"].strip().removeprefix("v")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*",requested):
              raise SystemExit("Beta must be an explicit X.Y.Z-beta.N tag")
          declared=Path("VERSION").read_text(encoding="utf-8").strip()
          if declared != requested:
              raise SystemExit(
                  f"VERSION mismatch: {declared!r} (must exactly match {requested!r})"
              )
          changelog=Path("CHANGELOG.md").read_text(encoding="utf-8")
          m=re.search(
              rf"^## {re.escape(requested)} - .*?\n(?P<body>.*?)(?=^## |\Z)",
              changelog,flags=re.M|re.S,
          )
          if not m:
              raise SystemExit(f"CHANGELOG beta entry missing for {requested}")
          Path("/tmp/postmaster-beta-notes.md").write_text(
              m.group(0).strip()+"\n",encoding="utf-8",
          )
          import sys
          sys.path.insert(0, str(Path("src").resolve()))
          from postmaster.release_channels_v986 import bootstrap_transport_tag
          transport = bootstrap_transport_tag("v" + requested)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write(f"RELEASE_TAG=v{requested}\n")
              fh.write(f"TRANSPORT_TAG={transport}\n")
          PY

      - name: Require green v9 runtime tests for this exact beta commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/v9-runtime-tests.yml/runs?head_sha=$GITHUB_SHA&per_page=100" > /tmp/postmaster-beta-ci.json
          python - <<'PY'
          import json,os
          with open("/tmp/postmaster-beta-ci.json",encoding="utf-8") as stream:
              payload=json.load(stream)
          sha=os.environ["GITHUB_SHA"]
          passed=any(
              run.get("head_sha")==sha and run.get("conclusion")=="success"
              for run in payload.get("workflow_runs",[])
          )
          if not passed:
              raise SystemExit(
                  "Refusing Beta publication: run and pass the v9 runtime tests "
                  "for the exact selected commit before publishing."
              )
          print("Verified successful v9 runtime tests for",sha)
          PY

      - name: Create immutable beta and numeric transport tags and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          REMOTE_SHA="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [ -n "$REMOTE_SHA" ]; then
            if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
              echo "ERROR: immutable beta tag already points to another commit" >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

          ALIAS_SHA="$(git ls-remote origin "refs/tags/$TRANSPORT_TAG" | awk '{print $1}')"
          if [ -n "$ALIAS_SHA" ] && [ "$ALIAS_SHA" != "$GITHUB_SHA" ]; then
            echo "ERROR: immutable beta transport tag already points to another commit" >&2
            exit 1
          fi
          if [ -z "$ALIAS_SHA" ]; then
            git tag "$TRANSPORT_TAG" "$GITHUB_SHA"
            git push origin "$TRANSPORT_TAG"
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --prerelease \
              --title "Postmaster MCP $RELEASE_TAG (Beta)" \
              --notes-file /tmp/postmaster-beta-notes.md
          fi

          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease > /tmp/beta.json
          python - <<'PY'
          import json,os
          data=json.load(open("/tmp/beta.json",encoding="utf-8"))
          assert data["tagName"]==os.environ["RELEASE_TAG"]
          assert data["isDraft"] is False
          assert data["isPrerelease"] is True
          print("Beta prerelease verified:",data["tagName"])
          PY
