name: Fix v9.2 test version once

on:
  push:
    branches:
      - v9.2.1-update-check-control
    paths:
      - 'scripts/fix_v9_2_test_version.py'
      - '.github/workflows/fix-v9-2-test-version-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.2.1-update-check-control
      - name: Make v9.2 test version agnostic
        run: |
          python scripts/fix_v9_2_test_version.py
          rm scripts/fix_v9_2_test_version.py
      - name: Commit test fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_v9_2_native_upload.py scripts/fix_v9_2_test_version.py
          git diff --cached --quiet && exit 0
          git commit -m 'Make native-upload version assertion release-agnostic'
          git push origin HEAD:v9.2.1-update-check-control
