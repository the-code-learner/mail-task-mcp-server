name: WhatsApp v9.9 controlled account interop

on:
  workflow_dispatch:
    inputs:
      require_inbound_echo:
        description: Require controlled direct peer to echo the direct probe token
        required: true
        default: true
        type: boolean
      require_group_echo:
        description: Require controlled peer to echo the group probe token
        required: true
        default: true
        type: boolean
      require_inbound_media:
        description: Require controlled peer media in the test group and Stored File handoff
        required: true
        default: true
        type: boolean
      require_remote_receipt:
        description: Require a remote delivery/read receipt for the direct probe text
        required: true
        default: true
        type: boolean
      run_media:
        description: Exercise direct/group encrypted media upload and send
        required: true
        default: true
        type: boolean
      observe_timeout_seconds:
        description: Seconds per controlled peer observation window (10-300)
        required: true
        default: '120'
        type: string

permissions:
  contents: read

concurrency:
  group: whatsapp-v990-controlled-interop
  cancel-in-progress: false

jobs:
  controlled-account:
    name: WhatsApp controlled-account full interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: whatsapp-v990-controlled
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate controlled-session secrets are configured
        env:
          AUTH_DB: ${{ secrets.POSTMASTER_WA_AUTH_DB_B64 }}
          AUTH_KEY: ${{ secrets.POSTMASTER_WA_AUTH_KEY_B64 }}
          TEST_JID: ${{ secrets.POSTMASTER_WA_TEST_JID }}
          TEST_GROUP_JID: ${{ secrets.POSTMASTER_WA_TEST_GROUP_JID }}
        run: |
          test -n "$AUTH_DB" || { echo "POSTMASTER_WA_AUTH_DB_B64 is not configured in the whatsapp-v990-controlled environment"; exit 2; }
          test -n "$AUTH_KEY" || { echo "POSTMASTER_WA_AUTH_KEY_B64 is not configured in the whatsapp-v990-controlled environment"; exit 2; }
          test -n "$TEST_JID" || { echo "POSTMASTER_WA_TEST_JID is not configured in the whatsapp-v990-controlled environment"; exit 2; }
          test -n "$TEST_GROUP_JID" || { echo "POSTMASTER_WA_TEST_GROUP_JID is not configured in the whatsapp-v990-controlled environment"; exit 2; }
          echo "Controlled-session secrets are configured (values not printed)."

      - name: Compile controlled interop harness
        run: |
          python -m compileall -q             src/postmaster/whatsapp_v990             scripts/whatsapp_v990_controlled_interop.py

      - name: Run controlled direct/group text/media/receipt/inbound interoperability
        env:
          PYTHONPATH: src
          POSTMASTER_WA_AUTH_DB_B64: ${{ secrets.POSTMASTER_WA_AUTH_DB_B64 }}
          POSTMASTER_WA_AUTH_KEY_B64: ${{ secrets.POSTMASTER_WA_AUTH_KEY_B64 }}
          POSTMASTER_WA_TEST_JID: ${{ secrets.POSTMASTER_WA_TEST_JID }}
          POSTMASTER_WA_TEST_GROUP_JID: ${{ secrets.POSTMASTER_WA_TEST_GROUP_JID }}
          POSTMASTER_WA_REQUIRE_INBOUND_ECHO: ${{ inputs.require_inbound_echo }}
          POSTMASTER_WA_REQUIRE_GROUP_ECHO: ${{ inputs.require_group_echo }}
          POSTMASTER_WA_REQUIRE_INBOUND_MEDIA: ${{ inputs.require_inbound_media }}
          POSTMASTER_WA_REQUIRE_REMOTE_RECEIPT: ${{ inputs.require_remote_receipt }}
          POSTMASTER_WA_RUN_MEDIA: ${{ inputs.run_media }}
          POSTMASTER_WA_OBSERVE_TIMEOUT_SECONDS: ${{ inputs.observe_timeout_seconds }}
          POSTMASTER_WA_EVIDENCE_PATH: whatsapp-v990-controlled-evidence.json
        run: python scripts/whatsapp_v990_controlled_interop.py

      - name: Upload non-secret interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-v990-controlled-evidence
          path: whatsapp-v990-controlled-evidence.json
          if-no-files-found: ignore
          retention-days: 1

      - name: State acceptance boundary
        if: always()
        run: |
          echo "This workflow never changes source acceptance flags automatically."
          echo "A release-qualifying run must leave every full-profile input enabled and must end with"
          echo "controlled_account_interop_observed=true in the non-secret evidence artifact."
          echo "A successful run must be reviewed before protocol_interop_verified, signal_multidevice_verified,"
          echo "or controlled_account_interop_verified can change in source."
          echo "No QR refs, auth database bytes, auth key, JIDs, private keys, session secrets or media payloads"
          echo "are written to the evidence artifact."
