name: Materialize v9 structural tree

on:
  push:
    branches:
      - v9-structural-runtime
    paths:
      - .v9-source-payload/trigger

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9-structural-runtime
          fetch-depth: 0

      - name: Rebuild verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .v9-source-payload/part-*.txt | base64 -d > /tmp/v9-structural-tree.tar.xz
          echo '70dbd1c2ec781e8f4a5e8e12e338371abd7c5e60f0c4e7f31b71cb261d803e65  /tmp/v9-structural-tree.tar.xz' | sha256sum -c -

      - name: Safely extract tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          archive = Path('/tmp/v9-structural-tree.tar.xz')
          root = Path('.')
          with tarfile.open(archive, 'r:xz') as tf:
              for member in tf.getmembers():
                  name = member.name.replace('\\', '/')
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe archive member: {member.name}')
              tf.extractall(root, filter='data')
          PY

      - name: Commit structural v9 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v9-source-payload
          rm -f .github/workflows/materialize-v9-structural-tree.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Materialize structural v9 runtime'
          git push origin HEAD:v9-structural-runtime
