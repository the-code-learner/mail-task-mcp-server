name: Fix v9.1 file tag listing once

on:
  push:
    branches:
      - v9.1-file-store
    paths:
      - 'scripts/fix_v9_1_file_tag_listing.py'
      - '.github/workflows/fix-v9-1-file-tag-listing-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.1-file-store
      - name: Apply listing fix
        run: |
          python scripts/fix_v9_1_file_tag_listing.py
          rm scripts/fix_v9_1_file_tag_listing.py
      - name: Commit code fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/postmaster/file_store.py scripts/fix_v9_1_file_tag_listing.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix scoped file tag listing pagination'
          git push origin HEAD:v9.1-file-store
