name: Apply v9.2 once

on:
  push:
    branches:
      - v9.2-native-file-upload
    paths:
      - 'scripts/apply_v9_2.py'
      - '.github/workflows/apply-v9-2-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.2-native-file-upload
      - name: Apply v9.2 transformation
        run: |
          python scripts/apply_v9_2.py
          rm scripts/apply_v9_2.py
      - name: Commit v9.2 source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/postmaster/server.py postmaster-mcp.yml README.md scripts/apply_v9_2.py
          git diff --cached --quiet && exit 0
          git commit -m 'Implement v9.2 native file upload and version-aware bootstrap'
          git push origin HEAD:v9.2-native-file-upload
