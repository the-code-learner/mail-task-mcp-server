name: v9 runtime tests

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'VERSION'
      - 'docs/**'
      - 'postmaster-mcp.yml'
      - 'requirements.txt'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/v9-runtime-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'VERSION'
      - 'docs/**'
      - 'postmaster-mcp.yml'
      - 'requirements.txt'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/v9-runtime-tests.yml'

permissions:
  contents: read

concurrency:
  group: v9-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: v9 runtime tests / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyYAML

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Validate release version metadata
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), version
          changelog = Path('CHANGELOG.md').read_text()
          assert f'## {version} - ' in changelog, 'VERSION must have a CHANGELOG release entry'
          print(f'Version metadata OK: {version}')
          PY

      - name: Validate provider-neutral public tree
        run: |
          python - <<'PY'
          from pathlib import Path
          needle = 'host' + 'inger'
          bad = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if needle in str(path).casefold():
                  bad.append(str(path))
                  continue
              try:
                  text = path.read_text(encoding='utf-8').casefold()
              except (UnicodeDecodeError, OSError):
                  continue
              if needle in text:
                  bad.append(str(path))
          assert not bad, f'provider-specific branding remains in public tree: {bad}'
          PY

      - name: Validate mounted-volume-safe venv rebuild
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/start.sh').read_text()
          assert 'rm -rf "$VENV_DIR"' not in text, 'must not remove a Docker volume mount point'
          assert 'find "$VENV_DIR" -mindepth 1 -maxdepth 1' in text, 'venv rebuild must clear only mount contents'
          PY

      - name: Verify compact context model provisioning
        env:
          CONTEXT_MODEL_PATH: /tmp/postmaster-ci-model
          CONTEXT_MODEL_AUTO_DOWNLOAD: 'true'
          CONTEXT_MODEL_URL: https://github.com/the-code-learner/mail-task-mcp-server/releases/download/context-model-v1/postmaster-context-mrl-128d-int8.tar.gz
          CONTEXT_MODEL_SHA256: 33aebe14cc1cc8e506bca5f2d08fe243f94d4a716875f172f96229bb33bff632
          CONTEXT_MODEL_SOURCE_FALLBACK: 'false'
          CONTEXT_MODEL_DIMS: '128'
        run: |
          python scripts/prepare_context_model.py
          test -s /tmp/postmaster-ci-model/model.safetensors
          test -s /tmp/postmaster-ci-model/tokenizer.json
          python - <<'PY'
          from model2vec import StaticModel
          model = StaticModel.from_pretrained('/tmp/postmaster-ci-model', normalize=True, force_download=False)
          encoded = model.encode(['memoria persistente', 'persistent memory'])
          assert encoded.shape == (2, 128), encoded.shape
          print('compact model provisioning OK')
          PY

      - name: Import complete MCP application
        env:
          PYTHONPATH: src
          MAIL_EMAIL: test@example.invalid
          MAIL_PASSWORD: test-only-password
          IMAP_HOST: imap.example.com
          SMTP_HOST: smtp.example.com
          ENABLE_SEND: 'false'
          CONTEXT_SEMANTIC_ENABLED: 'false'
          CONTEXT_DB_PATH: /tmp/postmaster-ci-knowledge.db
          SCHEDULER_DB_PATH: /tmp/postmaster-ci-scheduler.db
          MAIL_ACCOUNTS_DB_PATH: /tmp/postmaster-ci-accounts.db
          MAIL_ACCOUNTS_KEY_PATH: /tmp/postmaster-ci-accounts.key
          EMAIL_ANALYTICS_DB_PATH: /tmp/postmaster-ci-analytics.db
          EMAIL_ANALYTICS_KEY_PATH: /tmp/postmaster-ci-analytics.key
          RECIPIENT_POLICY_DB_PATH: /tmp/postmaster-ci-recipient-policy.db
          FILE_STORE_DB_PATH: /tmp/postmaster-ci-files.db
          FILE_STORE_ROOT: /tmp/postmaster-ci-files
        run: python -c 'import postmaster.server; print("server import OK")'

      - name: Validate single-YAML Portainer bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('postmaster-mcp.yml')
          raw = path.read_text()
          doc = yaml.safe_load(raw)
          assert isinstance(doc, dict)
          assert set(doc.get('services', {})) == {'postmaster-mcp'}
          assert 'configs' not in doc, 'v9 must not embed application source as Compose configs'
          assert path.stat().st_size < 16000, 'bootstrap YAML unexpectedly became monolithic again'

          service = doc['services']['postmaster-mcp']
          env = service['environment']
          assert env.get('MAIL_EMAIL', '') == ''
          assert env.get('MAIL_PASSWORD', '') == ''
          assert env['IMAP_HOST'] == 'imap.example.com'
          assert env['SMTP_HOST'] == 'smtp.example.com'
          assert env['POSTMASTER_VERSION'] == 'latest'
          assert env['POSTMASTER_FORCE_REFRESH'] == 'false'
          assert 'POSTMASTER_REF' not in env, 'public v9.2 YAML should use POSTMASTER_VERSION; legacy POSTMASTER_REF is runtime fallback only'
          assert env['CONTEXT_MODEL_DIMS'] == '128'
          assert env['CONTEXT_MODEL_ID'] == 'static-similarity-mrl-multilingual-v1-128d-int8'
          assert env['CONTEXT_MODEL_AUTO_DOWNLOAD'] == 'true'
          assert env['CONTEXT_MODEL_SHA256'] == '33aebe14cc1cc8e506bca5f2d08fe243f94d4a716875f172f96229bb33bff632'
          assert env['CONTEXT_MODEL_URL'].endswith('/context-model-v1/postmaster-context-mrl-128d-int8.tar.gz')
          assert env['FILE_STORE_DB_PATH'] == '/data/files.db'
          assert env['FILE_STORE_ROOT'] == '/data/files'
          assert env['FILE_STORE_MAX_BYTES'] == '1048576'
          assert env['FILE_STORE_MAX_TOTAL_BYTES'] == '104857600'
          assert env['FILE_STORE_MAX_FILES'] == '1000'
          assert env['FILE_STORE_TEXT_MAX_CHARS'] == '200000'
          assert env['FILE_STORE_REMOTE_TIMEOUT_SECONDS'] == '30'
          assert env['FILE_STORE_REMOTE_MAX_REDIRECTS'] == '3'
          assert env['FILE_STORE_REMOTE_MAX_BATCH_FILES'] == '20'

          command = service['command'][2]
          assert 'releases?per_page=100' in command, 'latest policy must scan stable releases'
          assert 'v([0-9]+)\\.([0-9]+)\\.([0-9]+)' in command, 'latest policy must filter application SemVer tags'
          assert 'release.get("draft")' in command and 'release.get("prerelease")' in command, 'latest policy must ignore draft/prerelease releases'
          assert 'POSTMASTER_REF:-latest' in command, 'legacy POSTMASTER_REF fallback must remain supported'
          assert 'using cached current release' in command, 'bootstrap must retain last known-good source on update lookup failure'
          assert '$' not in command.replace('$$', ''), 'container-side shell variables must be escaped as $$ for Compose'
          rendered = command.replace('$$', '$')
          Path('/tmp/postmaster-bootstrap.sh').write_text(rendered)
          print(f'bootstrap YAML OK: {path.stat().st_size} bytes')
          PY
          /bin/sh -n /tmp/postmaster-bootstrap.sh
          /bin/sh -n scripts/start.sh
