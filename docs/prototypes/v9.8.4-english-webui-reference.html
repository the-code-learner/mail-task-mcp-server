 const pctOpen=sentIds.size?Math.round(100*emailOpens.size/sentIds.size):0,pctClick=sentIds.size?Math.round(100*emailClicks.size/sentIds.size):0;
 const uniqueRecipients=new Set(sent.map(x=>x.recipient).filter(Boolean)).size,uniqueSenders=new Set(received.map(x=>x.sender).filter(Boolean)).size;

function inboundCandidates(){
 const seen=new Map();const q=search.value.trim().toLowerCase();
 scopedMails().filter(m=>m.box==='inbox').forEach(m=>{
  const address=m.addr.toLowerCase(),account=m.account,key=S.owner+'|'+account+'|'+address;
  if(!address.includes('@')||ignoredIncoming.includes(key)||savedContacts.some(c=>c.owner===S.owner&&c.address===address))return;
  if(!(address+' '+m.from).toLowerCase().includes(q))return;
  if(!seen.has(key))seen.set(key,{key,owner:S.owner,address,account,name:m.from,count:0,subject:m.subject});
  const candidate=seen.get(key);candidate.count++;
 });
 return [...seen.values()];
}

  body=`<div class="card"><div class="ct">Senders from Inbox <span class="chip">${candidates.length} to review</span></div>${candidates.map(c=>item(esc(c.name),esc(c.address)+' · Received at '+esc(accounts.find(a=>a.id===c.account)?.address||'')+' · '+c.count+' messages',authorizedRecipients.some(a=>a.value===c.address)?'<span class="contact-tag">Already authorized</span>':'To review',btn('Add to address book','add-contact','blue small',`data-key="${esc(c.key)}"`)+btn('Ignore','ignore-contact','small',`data-key="${esc(c.key)}"`))).join('')||'<div class="row">No senders to review for this account.</div>'}</div><details><summary>Ignored senders (${ignored})</summary><div>${ignoredIncoming.filter(k=>k.startsWith(S.owner+'|')).map(k=>`<div class="row flex"><span class="grow">${esc(k.split('|')[2])} · ${esc(accounts.find(a=>a.id===k.split('|')[1])?.address||'')}</span>${btn('Restore','restore-contact','small',`data-key="${esc(k)}"`)}</div>`).join('')||'<div class="row">No ignored senders.</div>'}</div></details><div class="notice">Suggestions are derived only from <b>Inbox</b>, never Spam. They are filtered by owner and account. Saving a contact does not authorize sending or change global rules.</div>`;
 }
 if(tab==='known')body=`<div class="card"><div class="ct">Known recipients from Sent <span class="tiny">${esc(S.account==='all'?'All selected mailboxes':currentAccount()?.address||'—')}</span></div>${known.map(c=>item(esc(c.name),esc(c.address)+' · '+esc(accounts.find(a=>a.id===c.account)?.address||''),'Sent history',btn('Compose','write','small',`data-to="${esc(c.address)}"`))).join('')||'<div class="row">No historical recipients for this mailbox.</div>'}</div>`;
 if(tab==='recipients')body=`<div class="card"><div class="ct">Explicitly authorized addresses <span class="chip">Global rules</span></div>${authorizedRecipients.map(x=>item(esc(x.value),esc(x.note),'Global',btn('Revoke','revoke-auth','danger small',`data-kind="recipient" data-value="${esc(x.value)}"`))).join('')||'<div class="row">No explicit authorizations.</div>'}</div>${btn('+ Authorize recipient','authorize','blue small','data-kind="recipient"')}`;
 if(tab==='domains')body=`<div class="card"><div class="ct">Explicitly authorized domains <span class="chip">Global rules</span></div>${authorizedDomains.map(x=>item(esc(x.value),esc(x.note),'Global',btn('Revoke','revoke-auth','danger small',`data-kind="domain" data-value="${esc(x.value)}"`))).join('')||'<div class="row">No authorized domains.</div>'}</div>${btn('+ Authorize domain','authorize','blue small','data-kind="domain"')}`;
 if(tab==='verify')body=`<div class="card"><div class="ct">Check recipient for sending account</div><form id="pm-check-auth" class="pad"><div class="filters"><label class="field">Sending account<select name="account" required>${ownerAccounts().map(a=>`<option value="${a.id}" ${S.account===a.id?'selected':''}>${esc(a.address)}</option>`).join('')}</select></label><label class="field">Recipient<input name="recipient" type="email" required placeholder="name@example.com"></label></div><button class="btn blue" type="submit">Check (demo)</button></form></div>${S.authResult?`<div class="notice">${esc(S.authResult)}</div>`:''}`;
 return `${heading('Contacts','Address book and mailbox sources; recipient/domain authorizations are global')}${tabs([['saved','Address book'],['incoming','From Inbox'],['known','From Sent'],['recipients','Authorized recipients'],['domains','Authorized domains'],['verify','Check sending']],tab,'contacts')}<div class="pad">${body}<div class="notice">The address book does not grant sending permission. Explicit recipient/domain authorizations are global to all sending accounts; historical recipients and inbox senders depend on the selected email account.</div></div>`;
}

function catalogPage(){let names=(catalog[S.catalog]||'').split(' ').filter(Boolean);let q=search.value.toLowerCase();names=names.filter(x=>x.toLowerCase().includes(q));return `${heading('MCP Catalog','v9.8.3 tools and non-WhatsApp differences in PR #48')}<div class="pad"><label class="field">Category<select data-category>${Object.keys(catalog).map(x=>`<option ${S.catalog===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><div class="card" style="margin-top:12px"><div class="ct">${esc(S.catalog)} <span class="tiny">${names.length} results</span></div><div class="row flex">${names.map(x=>`<button class="btn small" data-tool="${esc(x)}"><code>${esc(x)}</code></button>`).join('')}</div></div><div class="card"><div class="ct">New non-WhatsApp tools in PR #48</div><div class="row flex">${prNames.map(x=>`<button class="btn small" data-tool="${x}"><code>${x}</code></button>`).join('')}</div></div><div class="notice">Explorer demo: actual MCP calls are not enabled here.</div></div>`}
function homePage(){return `${heading('Overview','Operational scope · '+scopeHint(),btn('Version settings','home-versions','small'))}<div class="pad">${versionsCard()}<div class="stats" style="margin-top:15px">${stat('Unread',scopedMails().filter(x=>x.box==='inbox'&&x.unread).length,'Selected mailboxes')}${stat('Tracking events',scopedEvents().length,'Events within scope')}${stat('Stored files',scopedFiles().length,'Owner / project')}${stat('Tracked links',scopedLinks().length,'Owner / project')}</div><div class="card"><div class="ct">Quick access</div>${[['Email','inbox'],['Tracking','tracking'],['File Store','files'],['Activities','tasks'],['Contacts & permissions','contacts']].map(x=>item(x[0],'','',`<button class="btn small" data-page="${x[1]}">Open</button>`)).join('')}</div><div class="notice">Email is scoped by owner/account; stored files, tracked links and activities by owner/project. Recipient and domain permissions are global and managed in Contacts.</div></div>`}

function previewOf(f){if(f.mime==='application/pdf')return '<div class="document"><b style="font-size:17px;color:#345ec2">BUSINESS PROPOSAL</b><p>Demo document</p><hr><p><b>1. Goals</b></p><p>This preview represents a stored PDF.</p><p>No file was downloaded.</p><p style="margin-top:65px;color:#8894a6">Page 1 of 1</p></div>';
if(f.mime.startsWith('image/'))return '<div style="height:210px;background:linear-gradient(135deg,#9dbfe7,#3d6b92);color:white;display:grid;place-items:center;border-radius:8px;font-weight:800">DEMO IMAGE</div>';
if(f.mime==='text/csv')return '<pre>Month,Events,Status\nSeptember,128,OK\nOctober,154,OK\nNovember,96,OK</pre>';
if(f.mime==='application/json')return `<pre>${esc(JSON.stringify({project:'postmaster-mcp',preview:true,tracking:['email','link','file']},null,2))}</pre>`;
if(f.mime.startsWith('text/'))return `<pre>${esc(f.mime==='text/html'?'<h1>Demo HTML page</h1>\n<p>The code is not executed.</p>':'# Meeting notes\n\n- UX analysis\n- Unified tracking\n- Security first')}</pre>`;
if(f.mime.startsWith('audio/')||f.mime.startsWith('video/'))return '<div style="text-align:center;padding:48px 10px"><div style="font-size:34px">♫</div>Embedded player<br><span class="tiny">The demo file has no audio data.</span></div>';
return '<div style="text-align:center;padding:45px 10px">▣<br><b>Metadata only</b><div class="tiny">Unsafe or unsupported preview.</div></div>'}
function modalPage(){const m=S.modal;if(!m)return '';let title='',content='',foot='';if(m.type==='preview'){let f=files.find(x=>x.id===m.id);if(!f)return '';title='File preview';content=`<b>${esc(f.name)}</b><div class="sub">${esc(f.mime)} · ${esc(f.size)} · ${esc(f.project)}</div><div class="preview">${previewOf(f)}</div><div class="tiny"><b>file_id:</b> ${esc(f.id)}<br><b>Tag:</b> ${esc(f.tags)}<br><b>Tracked links:</b> ${scopedLinks().filter(x=>x.type==='file'&&x.target===f.id).length}</div>`;foot=btn('Create tracked link','previewlink','small',`data-id="${f.id}"`)+btn('Statistics','file-stats','small',`data-id="${f.id}"`)+btn('Download','download','blue small');}
else if(m.type==='link'){title='Create tracked link';content=`<form id="pm-create-link"><div class="flex" style="margin-bottom:14px">${btn('URL links','switchlink','small '+(S.linkType==='url'?'blue':''),'data-type="url"')}${btn('File links','switchlink','small '+(S.linkType==='file'?'blue':''),'data-type="file"')}</div><div style="display:grid;gap:11px"><label class="field">Label *<input name="label" required placeholder="Recognizable name"></label><label class="field">Project<select name="project"><option value="">No project</option>${ownerProjects().map(p=>`<option value="${esc(p.id)}" ${S.project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>${S.linkType==='url'?'<label class="field">Destination URL *<input type="url" name="target" placeholder="https://example.com" required></label>':`<label class="field">Stored file *<select name="target">${scopedFiles().map(f=>`<option value="${esc(f.id)}" ${S.fileId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label>`}<label class="field">Idempotency key (optional)<input name="idem"></label></div><div class="notice">The created link is a local demo placeholder, not a usable public URL.</div><div class="flex" style="justify-content:flex-end">${btn('Cancel','close','small')}<button class="btn blue" type="submit">Create demo link</button></div></form>`;}
else if(m.type==='revoke'){const l=links.find(x=>x.id===m.id);title='Confirm revocationtion';content=`<p>Revoke the link <b>${esc(l?.label)}</b>?</p><div class="notice">Event history remains available. No real link will be changed.</div>`;foot=btn('Cancel','close','small')+btn('Confirm revocationtion','confirm-revoke','small danger');}
else if(m.type==='compose'){title='Compose email';content=`<form id="pm-compose"><div style="display:grid;gap:11px"><label class="field">From<select name="account" required>${ownerAccounts().map(a=>`<option value="${esc(a.id)}" ${S.account===a.id?'selected':''}>${esc(a.address)} · ${esc(a.label)}</option>`).join('')}</select></label><label class="field">To<input name="to" value="${esc(m.to||'')}" required placeholder="recipient@example.com"></label><label class="field">Subject<input name="subject" value="${esc(m.subject||'')}"></label><label class="field">Message<textarea name="body">${esc(m.body||'')}</textarea></label><label class="field">File from storage<select name="file"><option value="">None</option>${scopedFiles().map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label class="tiny"><input type="checkbox" checked> Tracking enabled</label></div><div class="notice">Sending is simulated. Disabling tracking will require explicit approval in the future PR integration.</div><div class="flex" style="justify-content:flex-end">${btn('Save draft','draft','small')}<button class="btn blue" type="submit">Send (demo)</button></div></form>`;}
else if(m.type==='save-contact'){const c=inboundCandidates().find(x=>x.key===m.key);title='Add sender to address book';content=c?`<form id="pm-save-contact"><label class="field">Display name<input name="name" value="${esc(c.name)}" required></label><label class="field" style="margin-top:11px">Email address<input name="address" value="${esc(c.address)}" readonly></label><div class="notice">Source account: ${esc(accounts.find(a=>a.id===c.account)?.address||'—')} · The contact is saved for owner <b>${esc(S.owner)}</b> and <b>does not authorize</b> automated email sending.</div><div class="flex" style="justify-content:flex-end"><button type="submit" class="btn blue">Save to address book (demo)</button></div></form>`:'Sender not available in the selected scope.';}
else if(m.type==='authorize'){let domain=m.kind==='domain';title=domain?'Authorize domain (global)':'Authorize recipient (global)';content=`<form id="pm-auth-form"><label class="field">${domain?'Domain':'Email address'}<input name="value" ${domain?'':'type="email"'} required placeholder="${domain?'example.org':'user@example.com'}"></label><label class="field" style="margin-top:10px">Reason / note<input name="note" placeholder="Reason for authorization"></label><div class="notice">This policy applies to all sender accounts, regardless of owner, project or selected mailbox. No real change is made by this demo.</div><div class="flex" style="justify-content:flex-end;margin-top:15px"><button class="btn blue" type="submit">Confirm in demo</button></div></form>`;}
else if(m.type==='revoke-auth'){title='Revoke global authorization';content=`<p>Revoke <b>${esc(m.value)}</b> for all sender accounts?</p><div class="notice">This operation only changes demo-local data.</div>`;foot=btn('Cancel','close','small')+btn('Confirm global revocationtion','confirm-revoke-auth','danger small');}
else if(m.type==='version-preview'){title='Version change preview';content=`${versionsCard()}<div class="notice" style="margin-top:12px">Proposed change: <b>v${esc(S.installedVersion)}</b> → <b>v${esc(S.selectedVersion)}</b>. The real workflow must validate compatibility, deployment YAML and rollback instructions before execution. No live check was performed.</div>`;foot=btn('Close','close','small')+btn('Review selection','close','blue small');}
else if(m.type==='version-confirm'){title='Confirm demo version change';content=`<p>Change the <b>demo displayed version</b> from <b>v${esc(S.installedVersion)}</b> to <b>v${esc(S.selectedVersion)}</b>?</p><div class="notice">This changes only browser-local demo state. It does not update Postmaster, GitHub, Portainer or the deployment.</div>`;foot=btn('Cancel','close','small')+btn('Confirm demo change','version-confirm','blue small');}
else{title=m.title||'Feature';content=`<p>${esc(m.info||'This feature exists in the backend or is planned for integration, but is not connected in the demo.')}</p>`;foot=btn('Close','close','small');}
return `<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="mhead"><b>${title}</b><button class="headbtn" data-action="close">✕</button></div><div class="mbody">${content}</div>${foot?`<div class="mfoot">${foot}</div>`:''}</div></div>`}
function render(){updateScopeControls();root.querySelectorAll('button[data-page]').forEach(n=>n.classList.toggle('on',n.dataset.page===S.page));const views={inbox:mailPage,sent:mailPage,drafts:mailPage,spam:mailPage,tracking:trackingPage,files:filesPage,tasks:tasksPage,workspace:workspacePage,settings:settingsPage,contacts:contactsPage,catalog:catalogPage,home:homePage};main.innerHTML=(views[S.page]||homePage)()+(S.alert?`<div class="pad"><div class="notice">${esc(S.alert)}</div></div>`:'');overlay.innerHTML=modalPage()}
function go(page){S.page=page;S.reader=null;S.expanded=null;S.alert='';search.value='';render()}
function newLink(type='url',id=''){S.linkType=type;S.fileId=id;S.modal={type:'link'};render()}
function compose(to='',subject='',body=''){S.modal={type:'compose',to,subject,body};render()}
root.addEventListener('click',e=>{const t=e.target.closest('[data-page],[data-tab],[data-action],[data-mail],[data-preview],[data-tool],[data-cal-day],[data-job]');if(!t)return;
if(t.dataset.page){go(t.dataset.page);return}if(t.dataset.calDay){S.calendarSelected=t.dataset.calDay;render();return}if(t.dataset.job){const job=scopedTasks().find(x=>x.id===t.dataset.job);if(job){S.modal={type:'info',title:'Activity · '+job.title,info:job.day+' '+job.time+' · '+job.project+' · '+job.status+' (demo)'};render()}return}if(t.dataset.tab){S[t.dataset.tab]=t.dataset.value;render();return}if(t.dataset.mail){S.reader=t.dataset.mail;render();return}if(t.dataset.preview){S.modal={type:'preview',id:t.dataset.preview};render();return}if(t.dataset.tool){S.modal={type:'info',title:t.dataset.tool,info:'Tool available in v9.8.3 or proposed in PR #48. Live access requires an authenticated interface.'};render();return}
const a=t.dataset.action,id=t.dataset.id;
if(a==='cal-view'){S.calendarView=t.dataset.value;render();return}
if(a==='cal-prev'||a==='cal-next'){let d=new Date(S.calendarFocus+'T12:00:00');if(S.calendarView==='week')d.setDate(d.getDate()+(a==='cal-next'?7:-7));else d.setMonth(d.getMonth()+(a==='cal-next'?1:-1));S.calendarFocus=isoDay(d);render();return}
if(a==='cal-today'){S.calendarFocus='2026-11-13';S.calendarSelected='2026-11-13';render();return}
if(a==='open-job'){const job=scopedTasks().find(x=>x.id===id);S.modal={type:'info',title:job?'Activity · '+job.title:'Activity',info:job?job.day+' '+job.time+' · '+job.project+' · '+job.status+' (demo)':'Not found in current scope'};render();return}
if(a==='home-versions'){S.settings='versions';go('settings');return}
if(a==='settings-contacts'){S.contacts='recipients';go('contacts');return}
if(a==='version-check'){S.alert='Demo check: latest known stable is v'+S.latestVersion+'. No live update server was contacted.';render();return}
if(a==='version-preview'){S.modal={type:'version-preview'};render();return}
if(a==='version-apply'){S.modal={type:'version-confirm'};render();return}
if(a==='version-confirm'){S.installedVersion=S.selectedVersion;S.modal=null;S.alert='Demo only: displayed installed version is now v'+S.installedVersion+'. No deployment was changed.';render();return}
if(a==='period'){S.period=t.dataset.period||'7d';S.filters={};S.alert='';render();return}if(a==='add-contact'){const c=inboundCandidates().find(x=>x.key===t.dataset.key);if(c)S.modal={type:'save-contact',key:c.key};render();return}if(a==='ignore-contact'){const c=inboundCandidates().find(x=>x.key===t.dataset.key);if(c&&!ignoredIncoming.includes(c.key))ignoredIncoming.push(c.key);render();return}if(a==='restore-contact'){let i=ignoredIncoming.indexOf(t.dataset.key);if(i>=0)ignoredIncoming.splice(i,1);render();return}if(a==='remove-contact'){let i=savedContacts.findIndex(c=>c.owner===S.owner&&c.address===t.dataset.address);if(i>=0)savedContacts.splice(i,1);S.alert='Contact removed from the demo address book. Sending permissions were not changed.';render();return}
if(a==='theme'){root.classList.toggle('dark');return}if(a==='compose'){compose();return}if(a==='close'){S.modal=null;render();return}if(a==='back'){S.reader=null;render();return}if(a==='reply'||a==='forward'){const m=mails.find(x=>x.id===S.reader);if(m)compose(a==='reply'?m.addr:'',(a==='reply'?'Re: ':'Fwd: ')+m.subject,a==='forward'?m.body:'');return}if(a==='toggletracking'){S.expanded=S.expanded===id?null:id;render();return}if(a==='showemailtracking'){S.tracking='emails';go('tracking');return}
if(a==='create-link'){newLink(t.dataset.type||'url');return}if(a==='switchlink'){S.linkType=t.dataset.type;render();return}if(a==='filelink'||a==='previewlink'){newLink('file',id);return}if(a==='preview'){S.modal={type:'preview',id};render();return}if(a==='file-stats'){S.modal=null;S.tracking='filelinks';go('tracking');return}if(a==='download'){S.modal=null;S.alert='No download started; the demo does not contain real file bytes.';render();return}if(a==='revoke'){S.modal={type:'revoke',id};render();return}if(a==='confirm-revoke'){const l=links.find(x=>x.id===S.modal?.id);if(l)l.active=false;S.modal=null;S.alert='Demo revocationtion completed.';render();return}
if(a==='applyfilters'){root.querySelectorAll('[data-filtertext]').forEach(n=>S.filters[n.dataset.filtertext]=n.value.trim());render();return}if(a==='resetfilters'){S.filters={};render();return}if(a==='write'){compose(t.dataset.to);return}if(a==='authorize'){S.modal={type:'authorize',kind:t.dataset.kind||'recipient'};render();return}if(a==='revoke-auth'){S.modal={type:'revoke-auth',kind:t.dataset.kind,value:t.dataset.value};render();return}if(a==='confirm-revoke-auth'){let arr=S.modal.kind==='domain'?authorizedDomains:authorizedRecipients;let at=arr.findIndex(x=>x.value===S.modal.value);if(at>=0)arr.splice(at,1);S.modal=null;S.alert='Global authorization revoked in demo only.';render();return}if(a==='draft'){let form=root.querySelector('#pm-compose');if(form){let d=Object.fromEntries(new FormData(form));S.drafts.push({account:d.account||ownerAccounts()[0]?.id,id:'draft-'+S.drafts.length,box:'drafts',from:d.to||'Draft',addr:d.to||'',subject:d.subject||'(Senza oggetto)',snippet:d.body||'',body:d.body||'',time:'Ora'});S.modal=null;go('drafts');S.alert='Draft saved in the demo.';render()}return}
S.modal={type:'info',title:'Demo action'};render()});
root.addEventListener('change',e=>{let t=e.target;if(t.dataset.scope){if(t.dataset.scope==='owner'){S.owner=t.value;S.project=ownerProjects()[0]?.id||'all';S.account=ownerAccounts()[0]?.id||'all'}if(t.dataset.scope==='project')S.project=t.value;if(t.dataset.scope==='account')S.account=t.value;S.reader=null;S.expanded=null;S.modal=null;S.filters={};S.alert='';S.authResult='';search.value='';render();return}if(t.dataset.filter){S.filters[t.dataset.filter]=t.value;render()}if(t.dataset.sort){S.sort=t.value;render()}if(t.dataset.category){S.catalog=t.value;render()}if(t.id==='pm-version-select'){S.selectedVersion=t.value;render()}});
root.addEventListener('submit',e=>{
if(e.target.id==='pm-date-range'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.from||!d.to||d.from>d.to||d.to>'2026-11-13'){S.alert='Invalid period: check the dates (end cannot exceed Nov 13, 2026).';}else{S.customFrom=d.from;S.customTo=d.to;S.alert='';}render();return}
if(e.target.id==='pm-save-contact'){e.preventDefault();const candidate=inboundCandidates().find(x=>x.key===S.modal?.key),d=Object.fromEntries(new FormData(e.target));if(candidate&&!savedContacts.some(c=>c.owner===S.owner&&c.address===candidate.address)){savedContacts.push({owner:S.owner,name:(d.name||candidate.name).trim(),address:candidate.address,account:candidate.account,origin:'Inbox'});}S.modal=null;S.contacts='saved';S.alert='Contact saved in the demo address book. No sending authorization was added.';render();return}
if(e.target.id==='pm-auth-form'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),arr=S.modal.kind==='domain'?authorizedDomains:authorizedRecipients,v=(d.value||'').trim().toLowerCase();if(v&&!arr.some(x=>x.value===v))arr.push({value:v,note:d.note||'Explicit global authorization'});S.modal=null;S.alert='Global authorization added in demo only. No real policy was changed.';render();return}
if(e.target.id==='pm-check-auth'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),v=(d.recipient||'').trim().toLowerCase(),domain=v.split('@')[1]||'';let global=authorizedRecipients.some(x=>x.value===v)||authorizedDomains.some(x=>domain===x.value||domain.endsWith('.'+x.value));let history=mails.some(m=>m.box==='sent'&&m.account===d.account&&m.addr.toLowerCase()===v);S.authResult=global?'Explicit global authorization exists.':history?'Recipient is present in the selected account Sent history.':'No explicit permission or Sent history was found in the demo.';render();return}
if(e.target.id==='pm-create-link'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),id='l'+(links.length+1);links.unshift({id,type:S.linkType,owner:S.owner,label:d.label,target:d.target,project:d.project,active:true,url:'https://postmaster.demo.invalid/t/c/example-'+String(links.length+1).padStart(3,'0')});S.modal=null;S.tracking=S.linkType==='url'?'links':'filelinks';go('tracking');S.alert='Demo link created; the URL is not real.';render()}if(e.target.id==='pm-compose'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));const sentId='sent-'+mails.length;mails.unshift({account:d.account,id:sentId,box:'sent',from:d.to,addr:d.to,subject:d.subject||'(Senza oggetto)',snippet:(d.body||'').slice(0,65),body:d.body||'',time:'Ora'});mailActivity.push({id:sentId,account:d.account,kind:'sent',at:new Date(DEMO_NOW),recipient:d.to,tracked:true});S.modal=null;go('sent');S.alert='Email simulated; nothing was sent.';render()}});
search.addEventListener('input',()=>{if(!S.modal&&!S.reader&&['inbox','sent','drafts','spam','files','catalog','contacts'].includes(S.page))render()});
render();
})();
